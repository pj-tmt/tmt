# The handbook website (site/): checked on pull requests and main. Every push
# to main that changes the site deploys it to GitHub Pages; a manual run with
# deploy=true redeploys. The repository is public, so a deploy publishes the
# site publicly; the owner chose publish-on-merge. The build job is read-only;
# only the deploy job holds the Pages permissions. Pull requests never deploy.
name: Site

on:
  pull_request:
    paths: ['site/**', 'design/tokens/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'design/tokens/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Type, lint and format checks
        working-directory: site
        run: pnpm check
      - name: Build static files for GitHub Pages
        working-directory: site
        run: SITE_ORIGIN=https://pj-tmt.github.io pnpm build
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    # One Pages deployment at a time; a newer main queues behind it rather than
    # cancelling a deployment in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
