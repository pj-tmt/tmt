# The handbook website (site/): checked on pull requests and main, and
# deployed to GitHub Pages only by a manual run with deploy=true.
# The repository is public, so a deploy publishes the site publicly; the owner
# decides when (#584). The build job is read-only; only the deploy job holds
# the Pages permissions.
name: Site

on:
  pull_request:
    paths: ['site/**', 'design/tokens/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'design/tokens/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Type, lint and format checks
        working-directory: site
        run: pnpm check
      - name: Build static files for GitHub Pages
        working-directory: site
        run: pnpm build
      - name: Upload the Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
