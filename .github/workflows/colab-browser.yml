name: Colab browser verification

# Advisory evidence for L1 acceptance and the app component specs; never part of the required CI aggregates.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: Select affected Colab browser checks
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    concurrency:
      group: colab-browser-changes-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      colab_harness: ${{ steps.scope.outputs.colab_harness || 'false' }}
      colab_app: ${{ steps.scope.outputs.colab_app || 'false' }}
      colab_hosted: ${{ steps.scope.outputs.colab_hosted || 'false' }}
      colab_hosted_emulator: ${{ steps.scope.outputs.colab_hosted_emulator || 'false' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-tooling
      - name: Select consumers from both sides of the diff
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  colab-browser:
    name: Colab browser (${{ github.event_name == 'pull_request' && 'Chromium' || 'Chromium, Firefox; WebKitGTK refusal' }})
    needs: changes
    concurrency:
      group: colab-browser-interop-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.colab_harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Prepare browser evidence and binary paths
        run: |
          mkdir -p "$RUNNER_TEMP/colab-browser-results"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/colab-browsers" >> "$GITHUB_ENV"
          echo "COLAB_REPORT=$RUNNER_TEMP/colab-browser-results/report.json" >> "$GITHUB_ENV"
      - name: Install frozen browser tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install frozen app tooling for the refusal proof
        if: github.event_name != 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Build the normal app for the refusal proof
        if: github.event_name != 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match build
      - name: Read pinned Playwright version
        id: playwright
        working-directory: extensions/tmt-colab/typescript/colab-client
        run: node -p '"version=" + require("playwright/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore browser binaries
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: colab-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and Linux dependencies for PRs
        if: github.event_name == 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client exec playwright install --with-deps chromium
      - name: Install all three engines and Linux dependencies for the safety net
        if: github.event_name != 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client exec playwright install --with-deps chromium firefox webkit
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build interop examples before the harness deadline
        working-directory: rust
        run: cargo build --locked -p tmt-colab-model --example browser_conformance --example browser_authority
      - name: Verify Chromium corpus and interop for PRs
        if: github.event_name == 'pull_request'
        working-directory: typescript
        shell: bash
        run: pnpm --filter @tmt/colab-client --fail-if-no-match test:browser --engines chromium 2>&1 | tee "$RUNNER_TEMP/colab-browser-results/harness.log"
      - name: Verify strict Chromium and Firefox plus WebKitGTK refusal for the safety net
        if: github.event_name != 'pull_request'
        working-directory: typescript
        shell: bash
        env:
          COLAB_EXPECT_REFUSED_ENGINES: webkit
        run: pnpm --filter @tmt/colab-client --fail-if-no-match test:browser --engines chromium,firefox,webkit 2>&1 | tee "$RUNNER_TEMP/colab-browser-results/harness.log"
      - name: Upload available browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-browser-results
          path: ${{ runner.temp }}/colab-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Save browser binaries on main only
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}

  colab-webkit-macos:
    name: Colab WebKit conformance (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: colab-browser-webkit-macos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Prepare browser evidence and binary paths
        run: |
          mkdir -p "$RUNNER_TEMP/colab-webkit-macos-results"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/colab-browsers" >> "$GITHUB_ENV"
          echo "COLAB_REPORT=$RUNNER_TEMP/colab-webkit-macos-results/report.json" >> "$GITHUB_ENV"
      - name: Install frozen browser tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Read pinned Playwright version
        id: playwright
        working-directory: extensions/tmt-colab/typescript/colab-client
        run: node -p '"version=" + require("playwright/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore browser binaries
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: colab-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install WebKit for macOS conformance
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client exec playwright install webkit
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build interop examples before the harness deadline
        working-directory: rust
        run: cargo build --locked -p tmt-colab-model --example browser_conformance --example browser_authority
      - name: Verify strict WebKit corpus and interop
        working-directory: typescript
        shell: bash
        run: pnpm --filter @tmt/colab-client --fail-if-no-match test:browser --engines webkit 2>&1 | tee "$RUNNER_TEMP/colab-webkit-macos-results/harness.log"
      - name: Upload available browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-webkit-macos-results
          path: ${{ runner.temp }}/colab-webkit-macos-results
          if-no-files-found: warn
          retention-days: 7
      - name: Save browser binaries on main only
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}

  colab-app:
    name: Colab app component specs (Chromium, shard ${{ matrix.shard }}/5)
    needs: changes
    concurrency:
      group: colab-browser-app-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.colab_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Whole files are balanced by measured duration (#3618), using the acceptance helper.
    # Every file runs once; each shard owns its concurrency group and evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/colab-app-results"
      - name: Install frozen app tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and Linux dependencies
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app exec playwright install --with-deps chromium
      # One worker and no retries, as configured. The native-fixture specs (cli, chrome) skip
      # with a named reason here; the real-binary job below owns native behavior.
      - name: Run the app component specs
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/colab-app-results/results.json
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          shard_files="$(node scripts/colab-acceptance-shards.mjs ${{ matrix.shard }} 5 component)"
          read -r -a files <<< "$shard_files"
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No component spec files selected for this shard.' >&2
            exit 1
          fi
          pnpm --filter @tmt/colab-app --fail-if-no-match test:browser "${files[@]}" --reporter=dot,json --output "$RUNNER_TEMP/colab-app-results/traces" 2>&1 | tee "$RUNNER_TEMP/colab-app-results/run.log"
      - name: Upload run log and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-app-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/colab-app-results
          if-no-files-found: warn
          retention-days: 7

  colab-hosted:
    name: Colab hosted and native served specs (Chromium)
    needs: changes
    # The pin manifest, the hosted build and this spec select it for a PR; the label, weekly and
    # manual runs include the same spec in full acceptance, so the label never runs it twice.
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.colab_hosted == 'true' || needs.changes.outputs.colab_hosted_emulator == 'true') &&
      !contains(github.event.pull_request.labels.*.name, 'colab-acceptance')
    concurrency:
      group: colab-hosted-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TMT_COLAB_APP_DIR: ${{ github.workspace }}/extensions/tmt-colab/typescript/app/dist
      TMT_ACCEPTANCE_BIN_DIR: ${{ github.workspace }}/rust/target/debug
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - uses: ./.github/actions/apt-install
        with:
          packages: tmux
      - name: Install frozen app tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install frozen Remote client tooling for the hosted bundle
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and Linux dependencies
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app exec playwright install --with-deps chromium
      - name: Build the app before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match build
      # The hosted inventory rides in the same executable as the app: Remote's pinned Firebase
      # client first, then the hosted distribution (--base /), both embedded by the one build below.
      - name: Build Remote's Firebase client before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client --fail-if-no-match exec vp build --config vite.firebase.config.ts
      - name: Build the hosted app before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match build:hosted
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies without saving
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build all three real executables once
        env:
          TMT_COLAB_HOSTING_DIR: ${{ github.workspace }}/extensions/tmt-colab/typescript/app/dist-hosted
        run: cargo build --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-cli -p tmt-remote -p tmt-colab --bins
      # A separate invocation on purpose: selecting an example next to tmt-cli enables its
      # dev-dependency features (tmt-adapters test-isolation), and that `tmt` then refuses to run in a world.
      - name: Build Remote's offline Hosting composer example
        run: cargo build --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-remote --example compose_hosting
      - name: Run the hosted bundle spec with one worker
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match test:acceptance --workers=1 --reporter=list acceptance/hosted-bundle.spec.ts
      # The qualifier rebuilds Remote with test-emulator; ordinary acceptance must finish first.
      - name: Prove the real producer and hosted reader through the emulators
        if: needs.changes.outputs.colab_hosted_emulator == 'true'
        uses: ./.github/actions/hosted-reader-emulator
      # Last: the embedded proof temporarily hides checkout dist, always restoring it on exit.
      - name: Run native served specs without skips
        env:
          TMT_AGENT: '1'
          BROWSER: /usr/bin/true
          COLAB_SERVE_REQUIRED: '1'
          COLAB_SERVE_EMBEDDED: '1'
          COLAB_SERVE_EXECUTABLE: ${{ github.workspace }}/rust/target/debug/tmt-colab
          COLAB_SERVE_APP_DIR: ${{ runner.temp }}/colab-served-app
          COLAB_CAPTURE_DIR: ${{ runner.temp }}/colab-served-results/captures
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/colab-served-results/results.json
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/colab-served-results"
          cp -R ../extensions/tmt-colab/typescript/app/dist "$COLAB_SERVE_APP_DIR"
          mv ../extensions/tmt-colab/typescript/app/dist "$RUNNER_TEMP/colab-served-checkout"
          trap 'mv "$RUNNER_TEMP/colab-served-checkout" ../extensions/tmt-colab/typescript/app/dist' EXIT
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/colab-served-results/list.json" \
            pnpm --filter @tmt/colab-app --fail-if-no-match test:browser e2e/served.spec.ts --list --reporter=json
          pnpm --filter @tmt/colab-app --fail-if-no-match test:browser e2e/served.spec.ts --workers=1 --reporter=list,json --output "$RUNNER_TEMP/colab-served-results/traces"
          node scripts/colab-served-report.mjs "$RUNNER_TEMP/colab-served-results/list.json" "$PLAYWRIGHT_JSON_OUTPUT_FILE"

  colab-acceptance:
    name: Colab real-binary acceptance (Chromium, shard ${{ matrix.shard }}/2)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'unlabeled' &&
       contains(github.event.pull_request.labels.*.name, 'colab-acceptance') &&
       (github.event.action != 'labeled' || github.event.label.name == 'colab-acceptance'))
    concurrency:
      group: colab-acceptance-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      # A label edit must never cancel a running acceptance check.
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The one-worker suite (~100 specs, 22 to 30+ minutes as one job, #2827) runs as two shards of
    # whole spec files balanced by measured time (typescript/scripts/colab-acceptance-shards.mjs;
    # Playwright's own --shard put the heavy page-* specs in one shard), each with its own real
    # binaries and world; neither cancels the other.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TMT_COLAB_APP_DIR: ${{ github.workspace }}/extensions/tmt-colab/typescript/app/dist
      TMT_ACCEPTANCE_BIN_DIR: ${{ github.workspace }}/rust/target/debug
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - uses: ./.github/actions/apt-install
        with:
          packages: tmux
      - name: Prepare public evidence and private browser output
        run: |
          mkdir -p "$RUNNER_TEMP/colab-acceptance-results" "$RUNNER_TEMP/colab-acceptance-private"
          echo "PLAYWRIGHT_JSON_OUTPUT_FILE=$RUNNER_TEMP/colab-acceptance-private/results.json" >> "$GITHUB_ENV"
      - name: Install frozen app tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install frozen Remote client tooling for the hosted bundle
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and Linux dependencies
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app exec playwright install --with-deps chromium
      - name: Build the app before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match build
      # The hosted inventory rides in the same executable as the app: Remote's pinned Firebase
      # client first, then the hosted distribution (--base /), both embedded by the one build below.
      - name: Build Remote's Firebase client before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client --fail-if-no-match exec vp build --config vite.firebase.config.ts
      - name: Build the hosted app before embedding it
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app --fail-if-no-match build:hosted
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies without saving
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build all three real executables once
        env:
          TMT_COLAB_HOSTING_DIR: ${{ github.workspace }}/extensions/tmt-colab/typescript/app/dist-hosted
        run: cargo build --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-cli -p tmt-remote -p tmt-colab --bins
      # A separate invocation on purpose: selecting an example next to tmt-cli enables its
      # dev-dependency features (tmt-adapters test-isolation), and that `tmt` then refuses to run in a world.
      - name: Build Remote's offline Hosting composer example
        run: cargo build --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-remote --example compose_hosting
      # Core's native fixture the recipient provider runs as (codex/claude basename, managed launch
      # options accepted, then the recipient script under Node). Its own invocation, like the example above.
      - name: Build Core's interpreted provider fixture
        run: cargo build --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-adapters --example provider-script-fixture
      - name: Record the tested source and exact build hashes
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'pr-head: %s\ntested-merge: %s\n' "$PR_HEAD_SHA" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/colab-acceptance-results/tested-head.txt"
          sha256sum rust/target/debug/tmt rust/target/debug/tmt-remote rust/target/debug/tmt-colab rust/target/debug/examples/provider-script-fixture > "$RUNNER_TEMP/colab-acceptance-results/binaries.sha256"
          find extensions/tmt-colab/typescript/app/dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/colab-acceptance-results/assets.sha256"
          find extensions/tmt-colab/typescript/app/dist-hosted -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/colab-acceptance-results/hosted-assets.sha256"
      - name: Run this shard of the real-binary suite with one worker
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          shard_files="$(node scripts/colab-acceptance-shards.mjs ${{ matrix.shard }} 2)"
          read -r -a files <<< "$shard_files"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Shard ${{ matrix.shard }} of 2 has no spec files; refusing to run the whole suite." >&2
            exit 1
          fi
          pnpm --filter @tmt/colab-app --fail-if-no-match test:acceptance --workers=1 --reporter=list,json --output "$RUNNER_TEMP/colab-acceptance-private/traces" "${files[@]}"
      # Run once per full event, after the ordinary binaries and their hashes were consumed.
      - name: Prove the real producer and hosted reader through the emulators
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: ./.github/actions/hosted-reader-emulator
      - name: Retain only test outcomes without credentials or trace payloads
        if: always()
        shell: bash
        run: |
          node typescript/scripts/colab-acceptance-report.mjs
      - name: Upload public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-acceptance-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/colab-acceptance-results
          if-no-files-found: warn
          retention-days: 7
