name: Colab browser verification

# Advisory evidence for L1 acceptance; never part of the required CI aggregates.
on:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: colab-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected Colab browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      colab_harness: ${{ steps.scope.outputs.colab_harness || 'false' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-tooling
      - name: Select consumers from both sides of the diff
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  colab-browser:
    name: Colab browser (${{ github.event_name == 'pull_request' && 'Chromium' || 'Chromium, Firefox, WebKit' }})
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.colab_harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Prepare browser evidence and binary paths
        run: |
          mkdir -p "$RUNNER_TEMP/colab-browser-results"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/colab-browsers" >> "$GITHUB_ENV"
          echo "COLAB_REPORT=$RUNNER_TEMP/colab-browser-results/report.json" >> "$GITHUB_ENV"
      - name: Install frozen browser tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Read pinned Playwright version
        id: playwright
        working-directory: extensions/tmt-colab/typescript/colab-client
        run: node -p '"version=" + require("playwright/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore browser binaries
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: colab-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and Linux dependencies for PRs
        if: github.event_name == 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client exec playwright install --with-deps chromium
      - name: Install all three engines and Linux dependencies for the safety net
        if: github.event_name != 'pull_request'
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client exec playwright install --with-deps chromium firefox webkit
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build interop examples before the harness deadline
        working-directory: rust
        run: cargo build --locked -p tmt-colab-model --example browser_conformance --example browser_authority
      - name: Verify Chromium corpus and interop for PRs
        if: github.event_name == 'pull_request'
        working-directory: typescript
        shell: bash
        run: pnpm --filter @tmt/colab-client --fail-if-no-match test:browser --engines chromium 2>&1 | tee "$RUNNER_TEMP/colab-browser-results/harness.log"
      - name: Verify complete three-engine corpus and interop for the safety net
        if: github.event_name != 'pull_request'
        working-directory: typescript
        shell: bash
        run: pnpm --filter @tmt/colab-client --fail-if-no-match test:browser 2>&1 | tee "$RUNNER_TEMP/colab-browser-results/harness.log"
      - name: Upload available browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-browser-results
          path: ${{ runner.temp }}/colab-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Save browser binaries on main only
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}
