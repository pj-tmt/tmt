name: Large stdin diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/large-stdin-diagnostic.yml'
      - 'typescript/scripts/probe-large-stdin.mjs'
permissions:
  contents: read
jobs:
  probe:
    name: Exact incident / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      # Listing existing drafts requires push access; the fixed diagnostic invokes GETs only.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        node: ['26.12.1', '22.23.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the exact incident command without dispatch or publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ulimit -c 0
          node typescript/scripts/probe-large-stdin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdin-exact-${{ matrix.node }}
          path: stdin-probe-results/
          retention-days: 1
          if-no-files-found: error
