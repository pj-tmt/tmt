name: Large stdin diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/large-stdin-diagnostic.yml"
      - "typescript/scripts/probe-large-stdin.mjs"
permissions:
  contents: read
jobs:
  probe:
    name: stdin / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["26.12.1", "24.22.1", "22.23.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Compare large pipe readers and the release planner
        shell: bash
        run: |
          ulimit -c 0
          node typescript/scripts/probe-large-stdin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stdin-probe-${{ matrix.node }}
          path: stdin-probe-results/report.json
          if-no-files-found: error
