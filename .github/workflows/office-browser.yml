name: Office browser verification

# Advisory diagnostics: these partitions never gate merge and are not required
# checks. They run in their own workflow so that a red `CI` run means a required
# or selected check failed, and so that all twelve share one image build.
#
# Retired by Ben's CI/CD direction (#1851). Keep the workflow and artifacts;
# it has no automatic trigger and manual selection cannot admit product work.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected Office browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      office_browser: ${{ steps.scope.outputs.office_browser || 'false' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Select consumers from both sides of the diff
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  image:
    name: Build Office browser image
    needs: changes
    if: needs.changes.outputs.office_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the isolated browser, emulator and native Office image once
        run: docker build --target browser-tests -f extensions/tmt-office/typescript/services/office/Dockerfile -t tmt-office-browser:ci .
      - name: Save the image for the partitions
        run: docker save tmt-office-browser:ci | gzip -1 > "$RUNNER_TEMP/office-browser-image.tar.gz"
      - name: Share the image with the partitions
        uses: actions/upload-artifact@v4
        with:
          name: office-browser-image
          path: ${{ runner.temp }}/office-browser-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  office-emulator:
    name: Office browser (emulator)
    needs: [changes, image]
    if: needs.changes.outputs.office_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the shared browser image
        uses: actions/download-artifact@v4
        with:
          name: office-browser-image
          path: ${{ runner.temp }}/image
      - name: Load the shared browser image
        run: gunzip -c "$RUNNER_TEMP/image/office-browser-image.tar.gz" | docker load
      - name: Prepare browser failure artifacts
        run: mkdir -p "$RUNNER_TEMP/office-browser-results" && chmod 777 "$RUNNER_TEMP/office-browser-results"
      - name: Verify emulator sessions with restricted browser destinations
        id: emulator-tests
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci \
            sh /workspace/extensions/tmt-office/typescript/services/office/with-test-keyring.sh \
            firebase emulators:exec --only auth,firestore,functions \
            --project demo-tmt-office \
            --config /workspace/extensions/tmt-office/typescript/services/office/firebase.json \
            --non-interactive \
            'pnpm --filter @tmt/office exec playwright test --config playwright.emulator.config.ts --max-failures=0'
      - name: Make browser failure artifacts readable
        if: always() && (steps.emulator-tests.outcome == 'failure' || steps.emulator-tests.outcome == 'cancelled')
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/results" \
            --entrypoint sh \
            tmt-office-browser:ci \
            -c 'find /results -mindepth 1 -exec chmod a+rX {} +'
      - name: Upload browser failure artifacts
        if: always() && (steps.emulator-tests.outcome == 'failure' || steps.emulator-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: office-browser-emulator-results
          path: ${{ runner.temp }}/office-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Require emulator browser partition
        if: always()
        env:
          TEST_RESULT: ${{ steps.emulator-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"

  office-local:
    name: Office browser (local ${{ matrix.shard }})
    needs: [changes, image]
    # Retired for every event; #574 remains a preserved product finding.
    if: needs.changes.outputs.office_browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            partition: local-1
          - shard: 2/3
            partition: local-2
          - shard: 3/3
            partition: local-3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the shared browser image
        uses: actions/download-artifact@v4
        with:
          name: office-browser-image
          path: ${{ runner.temp }}/image
      - name: Load the shared browser image
        run: gunzip -c "$RUNNER_TEMP/image/office-browser-image.tar.gz" | docker load
      - name: Prepare browser failure artifacts
        run: mkdir -p "$RUNNER_TEMP/office-browser-results" && chmod 777 "$RUNNER_TEMP/office-browser-results"
      - name: Verify local browser composition without emulator contention
        id: local-tests
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci \
            pnpm --filter @tmt/office exec playwright test \
            --config playwright.local.config.ts --shard=${{ matrix.shard }} --max-failures=0
      - name: Make browser failure artifacts readable
        if: always() && (steps.local-tests.outcome == 'failure' || steps.local-tests.outcome == 'cancelled')
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/results" \
            --entrypoint sh \
            tmt-office-browser:ci \
            -c 'find /results -mindepth 1 -exec chmod a+rX {} +'
      - name: Upload browser failure artifacts
        if: always() && (steps.local-tests.outcome == 'failure' || steps.local-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: office-browser-${{ matrix.partition }}-results
          path: ${{ runner.temp }}/office-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Require local browser partition
        if: always()
        env:
          TEST_RESULT: ${{ steps.local-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"

  native-office-browser:
    name: Native Office browser (${{ matrix.shard }}/8)
    needs: [changes, image]
    # Retired for every event; #424 remains a preserved product finding.
    if: needs.changes.outputs.office_browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the shared browser image
        uses: actions/download-artifact@v4
        with:
          name: office-browser-image
          path: ${{ runner.temp }}/image
      - name: Load the shared browser image
        run: gunzip -c "$RUNNER_TEMP/image/office-browser-image.tar.gz" | docker load
      - name: Prepare browser failure artifacts
        run: mkdir -p "$RUNNER_TEMP/office-browser-results" && chmod 777 "$RUNNER_TEMP/office-browser-results"
      - name: Verify installed native companion shard
        id: native-tests
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m --network none \
            --env TMT_TEST_BROWSER_CHANNEL=chromium \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci \
            sh /workspace/extensions/tmt-office/typescript/services/office/with-test-keyring.sh \
            pnpm --filter @tmt/office exec playwright test \
            --config playwright.native.config.ts --shard=${{ matrix.shard }}/8 \
            --max-failures=0
      - name: Make native browser failure artifacts readable
        if: always() && (steps.native-tests.outcome == 'failure' || steps.native-tests.outcome == 'cancelled')
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/results" \
            --entrypoint sh \
            tmt-office-browser:ci \
            -c 'find /results -mindepth 1 -exec chmod a+rX {} +'
      - name: Upload browser failure artifacts
        if: always() && (steps.native-tests.outcome == 'failure' || steps.native-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: native-office-browser-${{ matrix.shard }}-of-8-results
          path: ${{ runner.temp }}/office-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Require native browser shard
        if: always()
        env:
          TEST_RESULT: ${{ steps.native-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"
