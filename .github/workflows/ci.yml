name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      office: ${{ steps.scope.outputs.office }}
      native_office: ${{ steps.scope.outputs.native_office }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Select consumers from both sides of the diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  office-browser:
    name: Office browser (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.office == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: emulator
            label: emulator
            image: emulator
          - suite: local
            label: local 1/3
            image: local-1
            shard: 1/3
          - suite: local
            label: local 2/3
            image: local-2
            shard: 2/3
          - suite: local
            label: local 3/3
            image: local-3
            shard: 3/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated browser and emulator verification
        run: docker build --target browser-tests -f extensions/tmt-office/typescript/services/office/Dockerfile -t tmt-office-browser:ci-${{ matrix.image }} .
      - name: Prepare browser failure artifacts
        run: mkdir -p "$RUNNER_TEMP/office-browser-results" && chmod 777 "$RUNNER_TEMP/office-browser-results"
      - name: Verify emulator sessions with restricted browser destinations
        id: emulator-tests
        if: matrix.suite == 'emulator'
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci-emulator \
            sh /workspace/extensions/tmt-office/typescript/services/office/with-test-keyring.sh \
            firebase emulators:exec --only auth,firestore,functions \
            --project demo-tmt-office \
            --config /workspace/extensions/tmt-office/typescript/services/office/firebase.json \
            --non-interactive \
            'pnpm --filter @tmt/office exec playwright test --config playwright.emulator.config.ts --max-failures=0'
      - name: Verify local browser composition without emulator contention
        id: local-tests
        if: matrix.suite == 'local'
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci-${{ matrix.image }} \
            pnpm --filter @tmt/office exec playwright test \
            --config playwright.local.config.ts --shard=${{ matrix.shard }} --max-failures=0
      - name: Make browser failure artifacts readable
        if: always() && (steps.emulator-tests.outcome == 'failure' || steps.emulator-tests.outcome == 'cancelled' || steps.local-tests.outcome == 'failure' || steps.local-tests.outcome == 'cancelled')
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/results" \
            --entrypoint sh \
            tmt-office-browser:ci-${{ matrix.image }} \
            -c 'find /results -mindepth 1 -exec chmod a+rX {} +'
      - name: Upload browser failure artifacts
        if: always() && (steps.emulator-tests.outcome == 'failure' || steps.emulator-tests.outcome == 'cancelled' || steps.local-tests.outcome == 'failure' || steps.local-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: office-browser-${{ matrix.image }}-results
          path: ${{ runner.temp }}/office-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Require emulator browser partition
        if: always() && matrix.suite == 'emulator'
        env:
          TEST_RESULT: ${{ steps.emulator-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"
      - name: Require local browser partition
        if: always() && matrix.suite == 'local'
        env:
          TEST_RESULT: ${{ steps.local-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"

  native-office-browser:
    name: Native Office browser (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.native_office == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated native Office verification
        run: docker build --target browser-tests -f extensions/tmt-office/typescript/services/office/Dockerfile -t tmt-office-browser:ci-native-${{ matrix.shard }} .
      - name: Prepare browser failure artifacts
        run: mkdir -p "$RUNNER_TEMP/office-browser-results" && chmod 777 "$RUNNER_TEMP/office-browser-results"
      - name: Verify installed native companion shard
        id: native-tests
        continue-on-error: true
        run: |
          docker run --rm --init --shm-size=256m --network none \
            --env TMT_TEST_BROWSER_CHANNEL=chromium \
            --volume "$RUNNER_TEMP/office-browser-results:/workspace/extensions/tmt-office/typescript/apps/office/test-results" \
            tmt-office-browser:ci-native-${{ matrix.shard }} \
            sh /workspace/extensions/tmt-office/typescript/services/office/with-test-keyring.sh \
            pnpm --filter @tmt/office exec playwright test \
            --config playwright.native.config.ts --shard=${{ matrix.shard }}/8 \
            --max-failures=0
      - name: Make native browser failure artifacts readable
        if: always() && (steps.native-tests.outcome == 'failure' || steps.native-tests.outcome == 'cancelled')
        run: |
          docker run --rm --network none \
            --volume "$RUNNER_TEMP/office-browser-results:/results" \
            --entrypoint sh \
            tmt-office-browser:ci-native-${{ matrix.shard }} \
            -c 'find /results -mindepth 1 -exec chmod a+rX {} +'
      - name: Upload browser failure artifacts
        if: always() && (steps.native-tests.outcome == 'failure' || steps.native-tests.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: native-office-browser-${{ matrix.shard }}-of-8-results
          path: ${{ runner.temp }}/office-browser-results
          if-no-files-found: warn
          retention-days: 7
      - name: Require native browser shard
        if: always()
        env:
          TEST_RESULT: ${{ steps.native-tests.outcome }}
        run: node typescript/scripts/ci-scope.mjs gate true "$TEST_RESULT"

  office:
    name: Office SPA
    needs: changes
    if: needs.changes.outputs.office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Office application and service without browser execution
        run: docker build --target browser-tests-base -f extensions/tmt-office/typescript/services/office/Dockerfile -t tmt-office-checks:ci .

  code-quality:
    name: Code quality
    needs: [changes, office]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Run code quality checks
        working-directory: typescript
        run: |
          pnpm check:tooling
          pnpm exec vitest run test/tooling/ci-scope.test.ts
      - name: Require selected Office verification
        env:
          OFFICE_SELECTED: ${{ needs.changes.outputs.office }}
          OFFICE_RESULT: ${{ needs.office.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$OFFICE_SELECTED" "$OFFICE_RESULT"

  native-rust:
    name: Native Rust contracts
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal
      - name: Verify native quality and locked builds
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo +1.88.0 build --locked
          cargo build --locked
          cargo build --locked --example storage-probe
      - name: Build independent native process fixtures
        working-directory: rust
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo build --locked -p tmt-office
          cargo build --locked --release -p tmt-cli
      - name: Set up Node.js test tooling
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install shell test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install test dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify embedded local Office companion
        working-directory: typescript
        env:
          # This rebuild replaces the companion used by native process fixtures.
          # Keep its debug-info policy consistent with their initial build.
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          pnpm office:build:local
          cd ../rust
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo clippy --locked -p tmt-office --features local-service -- -D warnings
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo build --locked -p tmt-office --features local-service
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo test --locked -p tmt-office --features local-service
      - name: Verify native process and shared parser contracts
        working-directory: typescript
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/release/tmt","args":[]}'
          TMT_TEST_STORAGE_PROBE: '{"executable":"${{ github.workspace }}/rust/target/debug/examples/storage-probe","args":[]}'
        run: |
          pnpm test:native --reporter=verbose

  unit-tests:
    name: Unit tests
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install shell and linkage test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh binutils
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Download the native executable for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64-unknown-linux-musl
          path: rust/target/debug
      - name: Run retained developer tooling tests
        working-directory: typescript
        # The deleted TypeScript source coverage denominator is not Rust coverage.
        # Rust unit/process contracts and Docker remain independent required gates.
        run: |
          chmod +x ../rust/target/debug/tmt
          pnpm test:run

  docker-e2e:
    name: Docker E2E
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Run Docker end-to-end tests
        working-directory: typescript
        run: pnpm test:e2e

  native-runtime-build:
    name: Build native runtime (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      # Runner allocation for the four targets owned by dist-workspace.toml.
      # These are raw PR executables, not cargo-dist release archives.
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache locked native compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: runtime-${{ matrix.target }}-rust1.97-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build the reviewed native runtime
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --locked --release --target '${{ matrix.target }}' -p tmt-cli
      - name: Record the Cargo-owned version
        working-directory: rust
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tmt-cli"))' > target/${{ matrix.target }}/release/version.txt
      - name: Share the same executable with matching runtime environments
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/tmt
            rust/target/${{ matrix.target }}/release/version.txt
          if-no-files-found: error
          retention-days: 1

  packed-native-install:
    # Preserve required historical check names while replacing the retired npm
    # product. Each row now executes native linkage/skill/SQLite runtime proof.
    name: Packed install (${{ matrix.label }})
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            container: false
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            container: false
          - label: Linux glibc x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: false
          - label: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: false
          - label: Linux musl x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: true
          - label: Linux musl arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Download the matching native executable
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime
      - name: Restore executable permission
        run: chmod +x runtime/tmt
      - name: Install linkage inspection tool
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils
      - name: Verify native runtime on matching host
        if: ${{ !matrix.container }}
        run: |
          node typescript/scripts/verify-native-runtime.mjs \
            --executable "$GITHUB_WORKSPACE/runtime/tmt" \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill skills/tmux-team/SKILL.md
      - name: Build the verification-only Alpine environment
        if: ${{ matrix.container }}
        run: docker build -f typescript/test/native/runtime.Dockerfile -t tmt-runtime-proof .
      - name: Verify the same static executable in matching native Alpine
        if: ${{ matrix.container }}
        run: |
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/runtime:/runtime:ro" \
            tmt-runtime-proof \
            --executable /runtime/tmt \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill /verification/skills/tmux-team/SKILL.md

  native-install-gate:
    name: Native package matrix
    if: ${{ always() }}
    needs:
      [changes, native-rust, unit-tests, docker-e2e, native-runtime-build, packed-native-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require every selected native gate
        env:
          NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
          CONTRACT_RESULT: ${{ needs.native-rust.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          DOCKER_RESULT: ${{ needs.docker-e2e.result }}
          BUILD_RESULT: ${{ needs.native-runtime-build.result }}
          MATRIX_RESULT: ${{ needs.packed-native-install.result }}
        run: |
          node typescript/scripts/ci-scope.mjs gate "$NATIVE_SELECTED" "$CONTRACT_RESULT" "$UNIT_RESULT" "$DOCKER_RESULT" "$BUILD_RESULT" "$MATRIX_RESULT"
