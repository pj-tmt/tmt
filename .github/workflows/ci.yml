name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  # Main pushes verify the complete inventory; weekly/manual events retain cache seeding.
  # PR and merge-group runs only restore; cache writers require the main ref.
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ci-main-verification' || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  # Only PRs cancel older runs. A main verification finishes once admitted;
  # the one pending main run is replaced by newer pushes and checks its SHA.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.main.outputs.verify || steps.event.outputs.verify }}
      macos: ${{ steps.main.outputs.macos || steps.event.outputs.macos }}
      main_full_admitted: ${{ steps.main.outputs.admitted || 'false' }}
      native: ${{ steps.mainfull.outputs.native || steps.scope.outputs.native || steps.queue.outputs.native || steps.seed.outputs.native }}
      native_scope: ${{ steps.mainfull.outputs.native_scope || steps.scope.outputs.native_scope || steps.queue.outputs.native_scope || steps.seed.outputs.native_scope }}
      native_notices: ${{ steps.mainfull.outputs.native_notices || steps.scope.outputs.native_notices || steps.queue.outputs.native_notices || steps.seed.outputs.native_notices }}
      release_rehearsal: ${{ steps.rehearsal.outputs.release_rehearsal || 'false' }}
      release_rehearsal_products: ${{ steps.rehearsal.outputs.release_rehearsal_products || '[]' }}
      remote_firestore: ${{ steps.mainfull.outputs.remote_firestore || steps.scope.outputs.remote_firestore || steps.queue.outputs.remote_firestore || 'false' }}
      colab_firestore: ${{ steps.mainfull.outputs.colab_firestore || steps.scope.outputs.colab_firestore || steps.queue.outputs.colab_firestore || 'false' }}
      native_sync_emulator: ${{ steps.mainfull.outputs.native_sync_emulator || steps.scope.outputs.native_sync_emulator || steps.queue.outputs.native_sync_emulator || 'false' }}
      colab_chrome: ${{ steps.mainfull.outputs.colab_chrome || steps.scope.outputs.colab_chrome || steps.queue.outputs.colab_chrome || 'false' }}
      browser_ui: ${{ steps.mainfull.outputs.browser_ui || steps.scope.outputs.browser_ui || steps.queue.outputs.browser_ui || steps.seed.outputs.browser_ui || 'false' }}
      scoped_native_tests: ${{ steps.mainfull.outputs.scoped_native_tests || steps.scope.outputs.scoped_native_tests || steps.queue.outputs.scoped_native_tests }}
      e2e_shard_1: ${{ steps.mainfull.outputs.e2e_shard_1 || steps.scope.outputs.e2e_shard_1 || steps.queue.outputs.e2e_shard_1 }}
      e2e_shard_2: ${{ steps.mainfull.outputs.e2e_shard_2 || steps.scope.outputs.e2e_shard_2 || steps.queue.outputs.e2e_shard_2 }}
    steps:
      - name: Classify verification and seed events
        id: event
        env:
          VERIFY: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
          MACOS: ${{ github.event_name != 'merge_group' }}
        run: printf 'verify=%s\nmacos=%s\n' "$VERIFY" "$MACOS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Admit only the pending current main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node typescript/scripts/ci-scope.mjs main-admit >> "$GITHUB_OUTPUT"
      - name: Select complete main verification
        if: steps.main.outputs.admitted == 'true'
        id: mainfull
        run: node typescript/scripts/ci-scope.mjs main-full >> "$GITHUB_OUTPUT"
      - name: Select the cache-seeding jobs
        if: steps.event.outputs.verify != 'true' && github.event_name != 'push'
        id: seed
        env:
          SEED_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'seed' }}
        run: node typescript/scripts/ci-scope.mjs "$SEED_SCOPE" >> "$GITHUB_OUTPUT"
      - name: Select consumers from the cumulative merge-group diff
        if: github.event_name == 'merge_group'
        id: queue
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node typescript/scripts/ci-scope.mjs merge-group "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Select consumers from both sides of the diff
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Pull requests only: merge groups never rehearse, and seed/weekly runs have the nightly workflow.
      - name: Select the release rehearsal products
        if: github.event_name == 'pull_request'
        id: rehearsal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/release-rehearsal.mjs select "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  code-quality:
    name: Code quality
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    needs: changes
    if: ${{ always() && needs.changes.outputs.verify != 'false' && (github.event_name != 'push' || needs.changes.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmt install --frozen-lockfile
      - name: Build the Rust TOML helper for cut and source-gate fixtures
        env:
          RUSTUP_TOOLCHAIN: 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          # Offline metadata tests require every locked workspace dependency, not only the helper.
          cargo fetch --locked --manifest-path rust/Cargo.toml
          cargo build --locked -p tmt-release-tool --bin release-version --manifest-path rust/Cargo.toml
      - name: Run code quality checks
        working-directory: typescript
        run: |
          pnpm check:tooling
          pnpm exec vp test run --config vitest.config.ts test/tooling/ci-scope.test.ts test/tooling/workspace-nextest.test.ts test/tooling/component-skills.test.ts test/tooling/release-cut.test.ts test/tooling/release-cut-live.test.ts test/tooling/release-source-at-ref.test.ts test/tooling/release-version-injection.test.ts test/tooling/release-workflow.test.ts test/tooling/release-parity.test.ts test/tooling/release-rehearsal.test.ts test/tooling/guide-budget.test.ts test/tooling/markdown-links.test.ts test/tooling/pr-agent-check.test.ts test/tooling/docker-workspace.test.ts
      - name: Verify isolated browser presentation leaf
        working-directory: typescript
        run: |
          pnpm --filter @tmt/browser-ui install --frozen-lockfile --ignore-scripts
          pnpm --filter @tmt/browser-ui --fail-if-no-match check
          pnpm --filter @tmt/browser-ui --fail-if-no-match test
          pnpm exec vp test run --config vitest.config.ts test/tooling/browser-ui-boundary.test.ts
      - name: Check conventional PR titles
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node typescript/scripts/pr-title-check.mjs
      - name: Check current PR Agent attribution
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node typescript/scripts/pr-agent-check.mjs
      - name: Install locked byte-codec tools
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client install --frozen-lockfile --ignore-scripts
      - name: Verify canonical bytes on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/remote-client --fail-if-no-match check
          pnpm --filter @tmt/remote-client --fail-if-no-match test
          # The door embeds the built SDK module; it must match its TypeScript source.
          pnpm --filter @tmt/remote-client --fail-if-no-match build
          git diff --exit-code -- ../extensions/tmt-remote/rust/tmt-remote/assets/
          test -z "$(git status --porcelain -- ../extensions/tmt-remote/rust/tmt-remote/assets/)"

      - name: Install locked colab-client tools
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client install --frozen-lockfile --ignore-scripts
      - name: Verify colab-client on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/colab-client --fail-if-no-match check
          pnpm --filter @tmt/colab-client --fail-if-no-match test

      - name: Install locked colab app tools
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app install --frozen-lockfile --ignore-scripts
      - name: Verify colab app on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/colab-app --fail-if-no-match check
          pnpm --filter @tmt/colab-app --fail-if-no-match test
          pnpm --filter @tmt/colab-app --fail-if-no-match build:bundles
          # The archive proof's app inventory, run on the real build so it cannot first fail at release.
          node scripts/verify-colab-app-entries.mjs ../extensions/tmt-colab/typescript/app/dist

  release-rehearsal:
    name: Release rehearsal (${{ matrix.product }})
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.release_rehearsal == 'true'
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.changes.outputs.release_rehearsal_products) }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-release-prepare.yml
    with:
      product: ${{ matrix.product }}
      sha: ${{ github.event.pull_request.head.sha }}
      upgrade: true

  native-notices:
    name: Native dependency notices
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Restore pinned packaging tools
        uses: actions/cache/restore@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
      - name: Install cargo-about when the release tool cache is absent
        run: |
          if [ ! -x "$HOME/.tmt-packaging/bin/cargo-about" ]; then
            cargo +1.97.0 install cargo-about --version 0.9.2 --features cli --locked --root "$HOME/.tmt-packaging"
          fi
          echo "$HOME/.tmt-packaging/bin" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies before offline notice generation
        working-directory: rust
        run: cargo fetch --locked
      - name: Reject placeholder notices for every active product and release target
        run: node typescript/scripts/verify-native-notices.mjs
      - name: Preserve notices and generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dependency-notices
          path: rust/target/native-notices/verified/
          retention-days: 7

  # The cross-screen chrome spec needs the native socket test executable that renders the fallback
  # chrome. It gates through `Native package matrix`: selected means success, a missing fixture fails.
  colab-chrome:
    name: Colab chrome spec (Chromium)
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.colab_chrome == 'true'
    # Pinned to the image used by the shared Chromium dependency action.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Install frozen app tooling
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      - name: Point Playwright at a restorable browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/colab-chrome-browsers" >> "$GITHUB_ENV"
      - name: Read pinned Playwright version
        id: playwright
        working-directory: extensions/tmt-colab/typescript/app
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: colab-chrome-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - uses: ./.github/actions/install-chromium-deps
      - name: Install Chromium
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app exec playwright install chromium
      - name: Save Chromium on main only
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: Install pinned Rust toolchain
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal
      - name: Restore shared Rust dependencies without saving
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Build the native chrome fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -j 2 -p tmt-colab --test socket --no-run --message-format=json > "$RUNNER_TEMP/chrome-fixture-build.json"
          executable="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "socket" and .executable != null) | .executable' "$RUNNER_TEMP/chrome-fixture-build.json")"
          test -x "$executable"
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Run the cross-screen chrome spec without skips
        env:
          COLAB_CHROME_REQUIRED: '1'
          COLAB_CHROME_FIXTURE_EXECUTABLE: ${{ steps.fixture.outputs.executable }}
          COLAB_CHROME_CAPTURE_DIR: ${{ runner.temp }}/colab-chrome-results/captures
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/colab-chrome-results/results.json
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/colab-chrome-results"
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/colab-chrome-results/list.json" \
            pnpm --filter @tmt/colab-app --fail-if-no-match test:browser e2e/chrome.spec.ts --list --reporter=json
          pnpm --filter @tmt/colab-app --fail-if-no-match test:browser e2e/chrome.spec.ts --workers=1 --reporter=list,json --output "$RUNNER_TEMP/colab-chrome-results/traces"
          node scripts/colab-native-spec-report.mjs "$RUNNER_TEMP/colab-chrome-results/list.json" "$PLAYWRIGHT_JSON_OUTPUT_FILE"
      # Fixture data only (synthetic pages, no account or device state); traces are kept for seven days.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colab-chrome-results
          path: ${{ runner.temp }}/colab-chrome-results/traces
          if-no-files-found: ignore
          retention-days: 7

  browser-ui:
    name: Design gallery audits (Chromium)
    needs: changes
    if: needs.changes.outputs.browser_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Install frozen gallery tooling
        working-directory: typescript
        run: pnpm --filter @tmt/browser-ui... --fail-if-no-match install --frozen-lockfile --ignore-scripts
      # Same Chromium steps as colab-chrome until Infra's single-owner helper (#4434) lands.
      - name: Point Playwright at a restorable browser directory
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/colab-chrome-browsers" >> "$GITHUB_ENV"
      - name: Read pinned Playwright version
        id: playwright
        working-directory: design/browser-ui
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: browsers
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: colab-chrome-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Playwright's with-deps installer runs its own unbounded apt-get update. The same packages go
      # through the bounded shared action instead: Playwright 1.63.0's `ubuntu24.04-x64` tools and
      # Chromium dependencies (refresh the list, and the test that pins it, when that version moves).
      - uses: ./.github/actions/apt-install
        with:
          packages: >-
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic
            xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
            fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2
      - name: Install Chromium
        working-directory: typescript
        run: pnpm --filter @tmt/browser-ui exec playwright install chromium
      - name: Save Chromium on main only
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: Run design gallery audits
        working-directory: typescript
        run: pnpm --filter @tmt/browser-ui --fail-if-no-match test:browser --workers=2
      # Only this synthetic gallery's failure traces; no product, account or host state.
      - name: Upload gallery failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-traces
          path: design/browser-ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  native-clippy:
    name: Native Rust clippy
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          sh scripts/install-ci-rust.sh 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Reject an unknown native scope
        if: needs.changes.outputs.native_scope != 'full' && needs.changes.outputs.native_scope != 'ops'
        run: |
          echo "No native checks are defined for scope '${{ needs.changes.outputs.native_scope }}'." >&2
          exit 1
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all --check
      - name: Lint workspace
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: rust
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint Ops
        if: needs.changes.outputs.native_scope == 'ops'
        working-directory: rust
        run: |
          cargo clippy --locked -p tmt-ops --all-targets -- -D warnings

  native-workspace-tests:
    name: Native Rust workspace tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Ceiling for the reusable collector; producer/consumers keep contents: read only.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/workspace-partitions.yml
    with:
      scope: ${{ needs.changes.outputs.native_scope }}
      native-sync: ${{ needs.changes.outputs.native_sync_emulator == 'true' }}
      save-cache: ${{ github.ref == 'refs/heads/main' && (needs.changes.outputs.verify == 'false' || needs.changes.outputs.main_full_admitted == 'true') }}
      partitions: 2

  native-process-tests:
    name: Native process contracts
    needs: changes
    if: ${{ always() && needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          sh scripts/install-ci-rust.sh 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-process-rust
          save-if: ${{ github.ref == 'refs/heads/main' && (needs.changes.outputs.verify == 'false' || needs.changes.outputs.main_full_admitted == 'true') }}
      - name: Set up Node.js and pnpm test tooling
        uses: ./.github/actions/setup-tooling
      - name: Install test dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install shell test dependency
        uses: ./.github/actions/apt-install
        with:
          packages: zsh tmux
      - name: Build independent native process fixtures
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: rust
        run: |
          cargo build --locked -p tmt-ops --bins --examples
          extension_started=$SECONDS
          cargo build --locked -p tmt-remote -p tmt-colab --bins
          echo "Built Remote/Colab process fixtures in $((SECONDS - extension_started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --locked --example storage-probe --example runtime-caller-fixture
          cargo build --locked -p tmt-test-support --example recording-cli-fixture
          cargo build --locked --release -p tmt-cli -p tmt-driver-herdr --bins
      - name: Build Ops process fixtures
        if: needs.changes.outputs.native_scope == 'ops'
        working-directory: rust
        run: |
          cargo build --locked -p tmt-ops --bins --examples
          extension_started=$SECONDS
          cargo build --locked -p tmt-remote -p tmt-colab --bins
          echo "Built Remote/Colab process fixtures in $((SECONDS - extension_started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --locked -p tmt-adapters --example runtime-caller-fixture
          cargo build --locked -p tmt-test-support --example recording-cli-fixture
          cargo build --locked --release -p tmt-cli -p tmt-driver-herdr --bins
      - name: Inject the synthetic alpha installation fixture
        if: needs.changes.outputs.native_scope == 'full' || contains(needs.changes.outputs.scoped_native_tests, 'extension-install.test.ts')
        uses: ./.github/actions/inject-release-version
        with:
          product: cli
      - name: Build the synthetic alpha installation fixture in debug mode
        if: needs.changes.outputs.native_scope == 'full' || contains(needs.changes.outputs.scoped_native_tests, 'extension-install.test.ts')
        working-directory: rust
        run: |
          set -euo pipefail
          started=$SECONDS
          cargo build --offline --locked -p tmt-cli --bin tmt
          expected=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$RUNNER_TEMP/release-version-state.json")
          test "$(target/debug/tmt --version)" = "$expected"
          mkdir -p target/debug/native-release-fixture
          cp target/debug/tmt target/debug/native-release-fixture/tmt
          cp target/release/tmt-driver-herdr target/debug/native-release-fixture/tmt-driver-herdr
          echo "Synthetic alpha installation fixture debug build: $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the synthetic alpha fixture source gate
        if: needs.changes.outputs.native_scope == 'full' || contains(needs.changes.outputs.scoped_native_tests, 'extension-install.test.ts')
        uses: ./.github/actions/inject-release-version
        with:
          product: cli
          phase: verify
      - name: Restore the reviewed development source before process tests
        if: needs.changes.outputs.native_scope == 'full' || contains(needs.changes.outputs.scoped_native_tests, 'extension-install.test.ts')
        run: |
          set -euo pipefail
          # The source gate has proved these are the only edits, implied by the CLI version.
          git restore --source=HEAD -- rust/Cargo.toml rust/Cargo.lock
          git diff --exit-code HEAD --
      - name: Verify native process and shared parser contracts
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: typescript
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/release/tmt","args":[]}'
          TMT_TEST_STORAGE_PROBE: '{"executable":"${{ github.workspace }}/rust/target/debug/examples/storage-probe","args":[]}'
        run: |
          pnpm test:native --reporter=verbose
      - name: Verify Ops native contracts
        if: needs.changes.outputs.native_scope == 'ops'
        working-directory: typescript
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/release/tmt","args":[]}'
          # Plain file names from the component map, validated when it is parsed.
          SCOPED_NATIVE_TESTS: ${{ needs.changes.outputs.scoped_native_tests }}
        run: |
          # Vitest filters match path substrings, so each name gets its directory:
          files=()
          for name in $SCOPED_NATIVE_TESTS; do files+=("test/native/$name"); done
          pnpm test:native --reporter=verbose "${files[@]}"

  native-msrv:
    name: Native Rust MSRV
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the declared minimum Rust version
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          printf 'MSRV=%s\nRUSTUP_TOOLCHAIN=%s\n' "$msrv" "$msrv" >> "$GITHUB_ENV"
      - name: Install the declared minimum Rust version
        run: sh scripts/install-ci-rust.sh "$MSRV" --profile minimal
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust-msrv
          save-if: ${{ github.ref == 'refs/heads/main' && (needs.changes.outputs.verify == 'false' || needs.changes.outputs.main_full_admitted == 'true') }}
      - name: Check all workspace targets at MSRV
        working-directory: rust
        run: cargo +"$MSRV" check --locked --workspace --all-targets

  native-rust:
    name: Native Rust contracts
    needs: [changes, native-clippy, native-workspace-tests, native-process-tests, native-msrv]
    # Preserve the outer gate's skipped result for scope none, and skip a main run
    # that was superseded (verify is explicitly 'false'; its workers were skipped).
    # Missing selection (empty outputs) must still reach this gate and fail, even
    # when all workers were skipped.
    if: ${{ always() && needs.changes.outputs.native_scope != 'none' && needs.changes.outputs.verify != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Require every selected Rust worker
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          CLIPPY_RESULT: ${{ needs.native-clippy.result }}
          TESTS_RESULT: ${{ needs.native-workspace-tests.result }}
          NATIVE_RESULT: ${{ needs.native-process-tests.result }}
          MSRV_RESULT: ${{ needs.native-msrv.result }}
        run: node typescript/scripts/ci-scope.mjs gate-rust "$NATIVE_SCOPE" "$CLIPPY_RESULT" "$TESTS_RESULT" "$NATIVE_RESULT" "$MSRV_RESULT"

  unit-tests:
    name: Unit tests
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install shell and linkage test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: zsh binutils
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmt install --frozen-lockfile
      - name: Install locked browser presentation guard inputs
        working-directory: typescript
        run: pnpm --filter @tmt/browser-ui install --frozen-lockfile --ignore-scripts
      - name: Prepare locked Cargo metadata inputs
        working-directory: rust
        run: cargo fetch --locked
      - name: Download the native executable for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64-unknown-linux-musl
          path: rust/target/debug
      - name: Download the Rust TOML helper for injection fixtures
        uses: actions/download-artifact@v4
        with:
          name: release-version-fixture
          path: rust/target/debug
      - name: Make the Rust TOML helper executable
        run: chmod +x rust/target/debug/release-version
      - name: Download the native caller launcher for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: native-caller-fixture-x86_64-unknown-linux-musl
          path: rust/target/debug/examples
      # Firestore Rules emulator suites: selected paths only (ci-scope remote_firestore/colab_firestore).
      - name: Select the hosted Temurin 21 for the Rules emulator
        if: needs.changes.outputs.remote_firestore == 'true'
        run: |
          test -n "$JAVA_HOME_21_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/java" -version
      - name: Install the pinned Firestore Rules emulator tools
        if: needs.changes.outputs.remote_firestore == 'true'
        run: npm install --global firebase-tools@15.29.0
      - name: Run the Remote Firestore Rules emulator suite
        if: needs.changes.outputs.remote_firestore == 'true'
        timeout-minutes: 8
        run: |
          firebase emulators:exec --only firestore --project demo-tmt-remote \
            --config extensions/tmt-remote/rust/tmt-remote/tests/emulator/firebase.json --non-interactive \
            'node --test extensions/tmt-remote/rust/tmt-remote/tests/emulator/suite.mjs'
      - name: Run the Colab Firestore Rules emulator suite
        if: needs.changes.outputs.colab_firestore == 'true'
        timeout-minutes: 8
        run: |
          image="tmt-colab-rules:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$image" extensions/tmt-colab/rust/tmt-colab/tests/emulator
          cleanup() {
            result=$?
            trap - EXIT
            if ! docker image rm "$image"; then
              if [ "$result" -eq 0 ]; then result=1; fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/extensions/tmt-colab:/c:ro" "$image" \
            firebase emulators:exec --only firestore --project demo-tmt-colab \
            --config /c/rust/tmt-colab/tests/emulator/firebase.json --non-interactive \
            'node --test /c/rust/tmt-colab/tests/emulator/suite.mjs'
      - name: Run retained developer tooling tests
        working-directory: typescript
        # The deleted TypeScript source coverage denominator is not Rust coverage.
        # Rust unit/process contracts and Docker remain independent required gates.
        run: |
          chmod +x ../rust/target/debug/tmt ../rust/target/debug/tmt-driver-herdr ../rust/target/debug/examples/colab-runtime-fixture
          chmod +x ../rust/target/debug/examples/runtime-caller-fixture
          pnpm test:run

  # The Docker E2E suite runs as two jobs so that the longest required job is
  # about half as long. `docker-e2e` below is the required check named `Docker E2E`.
  docker-e2e-shard-1:
    name: Docker E2E shard 1/2
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Plain file names from typescript/scripts/e2e-shards.mjs (a shard of the full
      # suite, or the Ops scope's file). Only the first shard of a full run also runs
      # the Rust adapter tests.
      TMT_E2E_FILES: ${{ needs.changes.outputs.e2e_shard_1 }}
      TMT_E2E_ADAPTER_TESTS: ${{ needs.changes.outputs.native_scope == 'full' && '1' || '0' }}
    steps: &docker-e2e-steps
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Name exact native E2E dependencies
        id: e2e-dependency-key
        run: node typescript/scripts/e2e-dependency-cache.mjs key >> "$GITHUB_OUTPUT"
      - name: Restore native E2E dependency archive
        id: e2e-dependencies
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tmt-e2e-dependencies
          key: ${{ steps.e2e-dependency-key.outputs.key }}
      - name: Admit restored native E2E dependencies
        id: e2e-admission
        if: steps.e2e-dependencies.outputs.cache-hit == 'true'
        env:
          DEPENDENCY_KEY: ${{ steps.e2e-dependency-key.outputs.key }}
          DEPENDENCY_ROOT: ${{ runner.temp }}/tmt-e2e-dependencies
        run: node typescript/scripts/e2e-dependency-cache.mjs admit "$DEPENDENCY_ROOT" "$DEPENDENCY_KEY" >> "$GITHUB_OUTPUT"
      - name: Configure the hosted Docker mirror
        uses: ./.github/actions/setup-docker-mirror
      - name: Set up Buildx only for an admitted archive
        id: e2e-mirror-builder
        continue-on-error: true
        if: steps.e2e-admission.outputs.usable == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.29.1
          cleanup: false
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Fall back to the original Buildx setup
        if: steps.e2e-admission.outputs.usable == 'true' && steps.e2e-mirror-builder.outcome == 'failure'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.29.1
      - name: Run Docker end-to-end tests
        working-directory: typescript
        env:
          TMT_E2E_DEPENDENCY_CACHE: ${{ steps.e2e-admission.outputs.usable == 'true' && format('{0}/tmt-e2e-dependencies', runner.temp) || '' }}
        run: node scripts/run-e2e.mjs

  docker-e2e-shard-2:
    name: Docker E2E shard 2/2
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMT_E2E_FILES: ${{ needs.changes.outputs.e2e_shard_2 }}
      TMT_E2E_ADAPTER_TESTS: '0'
    steps: *docker-e2e-steps

  docker-e2e:
    name: Docker E2E
    needs: [changes, docker-e2e-shard-1, docker-e2e-shard-2]
    if: ${{ always() && needs.changes.outputs.verify != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Require every selected Docker E2E shard
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          SHARD_1_RESULT: ${{ needs.docker-e2e-shard-1.result }}
          SHARD_2_RESULT: ${{ needs.docker-e2e-shard-2.result }}
        run: |
          node typescript/scripts/ci-scope.mjs gate-e2e "$NATIVE_SCOPE" "$SHARD_1_RESULT" "$SHARD_2_RESULT"

  native-runtime-build:
    name: Build native runtime (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      # Linux targets; macOS has separate jobs so its skipped result is observable.
      # These are raw PR executables, not cargo-dist release archives.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: &native-runtime-build-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: Install pinned Rust
        run: sh scripts/install-ci-rust.sh 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: runtime-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' && (needs.changes.outputs.verify == 'false' || needs.changes.outputs.main_full_admitted == 'true') }}
      - name: Build the reviewed native runtime
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          started=$SECONDS
          cargo build --locked --release --target '${{ matrix.target }}' -p tmt-cli -p tmt-driver-herdr --bins
          echo "Built native runtime in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the Rust TOML helper for tooling fixtures
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: cargo build --locked -p tmt-release-tool --bin release-version
      - name: Share the Rust TOML helper with tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: release-version-fixture
          path: rust/target/debug/release-version
          if-no-files-found: error
          retention-days: 1
      - name: Build the native caller launcher for tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: cargo build --locked --release --target '${{ matrix.target }}' -p tmt-adapters --example runtime-caller-fixture
      - name: Share the native caller launcher with tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: native-caller-fixture-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/examples/runtime-caller-fixture
          if-no-files-found: error
          retention-days: 1
      - name: Record the Cargo-owned version
        working-directory: rust
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tmt-cli"))' > target/${{ matrix.target }}/release/version.txt
      - name: Build the native Colab verifier fixture
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --locked --release --target '${{ matrix.target }}' -p tmt-test-support --example colab-runtime-fixture
      - name: Share the same executable with matching runtime environments
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/tmt
            rust/target/${{ matrix.target }}/release/tmt-driver-herdr
            rust/target/${{ matrix.target }}/release/examples/colab-runtime-fixture
            rust/target/${{ matrix.target }}/release/version.txt
          if-no-files-found: error
          retention-days: 1

  native-runtime-build-macos:
    name: Build native runtime (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.macos == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: *native-runtime-build-steps

  packed-native-install:
    # Preserve required historical check names while replacing the retired npm
    # product. Each row now executes native linkage/skill/SQLite runtime proof.
    name: Packed install (${{ matrix.label }})
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux glibc x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: false
          - label: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: false
          - label: Linux musl x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: true
          - label: Linux musl arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: &packed-native-install-steps
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          architecture: ${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Download the matching native executable
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime
      - name: Restore executable permission
        run: chmod +x runtime/tmt
      - name: Install linkage inspection tool
        if: runner.os == 'Linux' && !matrix.container
        uses: ./.github/actions/apt-install
        with:
          packages: binutils
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Verify native runtime with the matching target process
        if: ${{ !matrix.container }}
        run: |
          scripts/run-native-verification.sh '${{ matrix.target }}' <<'VERIFY'
          started=$SECONDS
          node typescript/scripts/verify-native-runtime.mjs \
            --executable "$GITHUB_WORKSPACE/runtime/tmt" \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill skills/tmt/SKILL.md
          echo "Verified native runtime in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          VERIFY
      - name: Configure the hosted Docker mirror
        if: ${{ matrix.container }}
        uses: ./.github/actions/setup-docker-mirror
      - name: Build the verification-only Alpine environment
        if: ${{ matrix.container }}
        run: docker build -f typescript/test/native/runtime.Dockerfile -t tmt-runtime-proof .
      - name: Verify the same static executable in matching native Alpine
        if: ${{ matrix.container }}
        run: |
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/runtime:/runtime:ro" \
            tmt-runtime-proof \
            --executable /runtime/tmt \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill /verification/skills/tmt/SKILL.md

  packed-native-install-macos:
    name: Packed install (${{ matrix.label }})
    needs: [changes, native-runtime-build-macos]
    if: needs.changes.outputs.macos == 'true' && needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-15
            target: x86_64-apple-darwin
            container: false
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            container: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: *packed-native-install-steps

  native-install-gate:
    name: Native package matrix
    if: ${{ always() && needs.changes.outputs.verify != 'false' }}
    needs:
      [
        changes,
        native-notices,
        colab-chrome,
        browser-ui,
        release-rehearsal,
        native-rust,
        unit-tests,
        docker-e2e-shard-1,
        docker-e2e-shard-2,
        native-runtime-build,
        packed-native-install,
        native-runtime-build-macos,
        packed-native-install-macos,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Require every selected native gate
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          CONTRACT_RESULT: ${{ needs.native-rust.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SHARD_1_RESULT: ${{ needs.docker-e2e-shard-1.result }}
          SHARD_2_RESULT: ${{ needs.docker-e2e-shard-2.result }}
          BUILD_RESULT: ${{ needs.native-runtime-build.result }}
          MATRIX_RESULT: ${{ needs.packed-native-install.result }}
          MACOS_BUILD_RESULT: ${{ needs.native-runtime-build-macos.result }}
          MACOS_MATRIX_RESULT: ${{ needs.packed-native-install-macos.result }}
          MACOS_SELECTED: ${{ needs.changes.outputs.macos }}
        run: |
          node typescript/scripts/ci-scope.mjs gate-native "$MACOS_SELECTED" "$NATIVE_SCOPE" "$CONTRACT_RESULT" "$UNIT_RESULT" "$SHARD_1_RESULT" "$SHARD_2_RESULT" "$BUILD_RESULT" "$MATRIX_RESULT" "$MACOS_BUILD_RESULT" "$MACOS_MATRIX_RESULT"
      - name: Require selected dependency notices verification
        env:
          NOTICES_SELECTED: ${{ needs.changes.outputs.native_notices }}
          NOTICES_RESULT: ${{ needs.native-notices.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$NOTICES_SELECTED" "$NOTICES_RESULT"
      - name: Require the selected Colab chrome spec
        env:
          CHROME_SELECTED: ${{ needs.changes.outputs.colab_chrome }}
          CHROME_RESULT: ${{ needs.colab-chrome.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$CHROME_SELECTED" "$CHROME_RESULT"
      - name: Require the selected design gallery audits
        env:
          BROWSER_UI_SELECTED: ${{ needs.changes.outputs.browser_ui }}
          BROWSER_UI_RESULT: ${{ needs.browser-ui.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$BROWSER_UI_SELECTED" "$BROWSER_UI_RESULT"
      - name: Require the selected release rehearsal
        env:
          REHEARSAL_SELECTED: ${{ needs.changes.outputs.release_rehearsal }}
          REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$REHEARSAL_SELECTED" "$REHEARSAL_RESULT"

  complete-main:
    name: Complete trusted-main verification
    needs:
      - changes
      - code-quality
      - native-notices
      - colab-chrome
      - browser-ui
      - native-clippy
      - native-workspace-tests
      - native-process-tests
      - native-msrv
      - native-rust
      - unit-tests
      - docker-e2e-shard-1
      - docker-e2e-shard-2
      - docker-e2e
      - native-runtime-build
      - native-runtime-build-macos
      - packed-native-install
      - packed-native-install-macos
      - native-install-gate
    if: ${{ always() && github.repository == 'pj-tmt/tmt' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.main_full_admitted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Require the complete trusted-main inventory
        env:
          MAIN_FULL_NEEDS: ${{ toJSON(needs) }}
        run: node typescript/scripts/ci-scope.mjs gate-main

  notify-main-failure:
    name: Report main verification failure
    needs: [changes, complete-main]
    if: ${{ always() && github.repository == 'pj-tmt/tmt' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.result == 'failure' || needs.complete-main.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - name: Notify Infra of failed complete main verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node typescript/scripts/ci-scope.mjs notify-main-failure
