name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  # Main pushes, weekly schedules and manual dispatch seed Rust caches.
  # PR and merge-group runs only restore; cache writers require the main ref.
  push:
    branches: [main]
    paths:
      - rust/Cargo.lock
      - rust/Cargo.toml
      - rust/rust-toolchain.toml
      - .github/workflows/ci.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push replaces an older pull request run. A seed run is never
  # cancelled, because a cancelled run writes no cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.event.outputs.verify }}
      macos: ${{ steps.event.outputs.macos }}
      native: ${{ steps.scope.outputs.native || steps.queue.outputs.native || steps.seed.outputs.native }}
      office: ${{ steps.scope.outputs.office || steps.queue.outputs.office || steps.seed.outputs.office }}
      native_office: ${{ steps.scope.outputs.native_office || steps.queue.outputs.native_office || steps.seed.outputs.native_office }}
      native_scope: ${{ steps.scope.outputs.native_scope || steps.queue.outputs.native_scope || steps.seed.outputs.native_scope }}
      scoped_native_tests: ${{ steps.scope.outputs.scoped_native_tests || steps.queue.outputs.scoped_native_tests }}
      e2e_shard_1: ${{ steps.scope.outputs.e2e_shard_1 || steps.queue.outputs.e2e_shard_1 }}
      e2e_shard_2: ${{ steps.scope.outputs.e2e_shard_2 || steps.queue.outputs.e2e_shard_2 }}
    steps:
      - name: Classify verification and seed events
        id: event
        env:
          VERIFY: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
          MACOS: ${{ github.event_name != 'merge_group' }}
        run: printf 'verify=%s\nmacos=%s\n' "$VERIFY" "$MACOS" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Select the cache-seeding jobs
        if: steps.event.outputs.verify != 'true'
        id: seed
        # Weekly/manual runs revive Office coverage; main pushes only seed Rust caches.
        env:
          SEED_SCOPE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'seed' }}
        run: node typescript/scripts/ci-scope.mjs "$SEED_SCOPE" >> "$GITHUB_OUTPUT"
      - name: Select consumers from the cumulative merge-group diff
        if: github.event_name == 'merge_group'
        id: queue
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: node typescript/scripts/ci-scope.mjs merge-group "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Select consumers from both sides of the diff
        if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node typescript/scripts/ci-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  office:
    name: Office SPA
    needs: changes
    if: needs.changes.outputs.office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Office application and service without browser execution
        run: docker build --target browser-tests-base -f extensions/tmt-office/typescript/services/office/Dockerfile -t tmt-office-checks:ci .

  code-quality:
    name: Code quality
    needs: [changes, office]
    if: ${{ always() && needs.changes.outputs.verify != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Install pinned release-config test API
        working-directory: .github/release-please
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run code quality checks
        working-directory: typescript
        run: |
          pnpm check:tooling
          pnpm exec vp test run --config vitest.config.ts test/tooling/ci-scope.test.ts test/tooling/release-please-config.test.ts test/tooling/release-stall.test.ts test/tooling/release-pr-safety.test.ts
      - name: Verify release PR notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node typescript/scripts/release-pr-safety.mjs notes
      - name: Report conventional PR titles
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node typescript/scripts/release-pr-safety.mjs titles-report
      - name: Require selected Office verification
        env:
          OFFICE_SELECTED: ${{ needs.changes.outputs.office }}
          OFFICE_RESULT: ${{ needs.office.result }}
        run: node typescript/scripts/ci-scope.mjs gate "$OFFICE_SELECTED" "$OFFICE_RESULT"
      - name: Install locked byte-codec tools
        working-directory: typescript
        run: pnpm --filter @tmt/remote-client install --frozen-lockfile --ignore-scripts
      - name: Verify canonical bytes on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/remote-client --fail-if-no-match check
          pnpm --filter @tmt/remote-client --fail-if-no-match test
          # The door embeds the built SDK module; it must match its TypeScript source.
          pnpm --filter @tmt/remote-client --fail-if-no-match build
          git diff --exit-code -- ../extensions/tmt-remote/rust/tmt-remote/assets/
          test -z "$(git status --porcelain -- ../extensions/tmt-remote/rust/tmt-remote/assets/)"

      - name: Install locked colab-client tools
        working-directory: typescript
        run: pnpm --filter @tmt/colab-client install --frozen-lockfile --ignore-scripts
      - name: Verify colab-client on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/colab-client --fail-if-no-match check
          pnpm --filter @tmt/colab-client --fail-if-no-match test

      - name: Install locked colab app tools
        working-directory: typescript
        run: pnpm --filter @tmt/colab-app install --frozen-lockfile --ignore-scripts
      - name: Verify colab app on every pull request
        working-directory: typescript
        run: |
          pnpm --filter @tmt/colab-app --fail-if-no-match check
          pnpm --filter @tmt/colab-app --fail-if-no-match test
          pnpm --filter @tmt/colab-app --fail-if-no-match build

  native-clippy:
    name: Native Rust clippy
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Reject an unknown native scope
        if: needs.changes.outputs.native_scope != 'full' && needs.changes.outputs.native_scope != 'squad'
        run: |
          echo "No native checks are defined for scope '${{ needs.changes.outputs.native_scope }}'." >&2
          exit 1
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all --check
      - name: Lint workspace
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: rust
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint Squad
        if: needs.changes.outputs.native_scope == 'squad'
        working-directory: rust
        run: |
          cargo clippy --locked -p tmt-squad --all-targets -- -D warnings

  native-workspace-tests:
    name: Native Rust workspace tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: ${{ needs.changes.outputs.verify == 'false' && github.ref == 'refs/heads/main' }}
      - name: Test and build workspace
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: rust
        run: |
          remote_tests="$(cargo test --locked -p tmt-remote -- --list)"
          printf '%s\n' "$remote_tests"
          grep -q ': test$' <<< "$remote_tests"
          cargo test --locked --workspace
          cargo build --locked --workspace
      - name: Test Squad and architecture
        if: needs.changes.outputs.native_scope == 'squad'
        working-directory: rust
        run: |
          cargo test --locked -p tmt-squad
          cargo test --locked -p tmt-cli --test architecture

  native-office-build:
    name: Build Office native fixture
    needs: changes
    if: needs.changes.outputs.native_scope == 'full' && needs.changes.outputs.native_office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Set up Node.js and pnpm test tooling
        uses: ./.github/actions/setup-tooling
      - name: Install test dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the independent Office companion
        working-directory: rust
        run: cargo build --locked -p tmt-office
      - name: Build the embedded local Office companion
        working-directory: typescript
        run: |
          pnpm office:build:local
          cd ../rust
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo build --locked -p tmt-office --features local-service
      - name: Record the verified companion bytes
        working-directory: rust/target/debug
        run: sha256sum tmt-office > tmt-office.sha256
      - name: Share the verified companion with native tests
        uses: actions/upload-artifact@v4
        with:
          name: native-office-companion
          path: |
            rust/target/debug/tmt-office
            rust/target/debug/tmt-office.sha256
            target/office-spa
          if-no-files-found: error
          retention-days: 1

  native-office:
    name: Native Rust Office local service
    needs: [changes, native-office-build]
    if: needs.changes.outputs.native_scope == 'full' && needs.changes.outputs.native_office == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Download the Office fixture and embedded SPA
        uses: actions/download-artifact@v4
        with:
          name: native-office-companion
          path: .
      - name: Verify embedded local Office companion
        working-directory: rust
        run: |
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo clippy --locked -p tmt-office --features local-service -- -D warnings
          TMT_OFFICE_SPA_DIR="${{ github.workspace }}/target/office-spa" cargo test --locked -p tmt-office --features local-service

  native-process-tests:
    name: Native process contracts
    needs: [changes, native-office-build]
    if: ${{ always() && needs.changes.outputs.native == 'true' && (needs.changes.outputs.native_scope == 'squad' || needs.changes.outputs.native_office == 'false' || (needs.changes.outputs.native_office == 'true' && needs.native-office-build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Set up Node.js and pnpm test tooling
        uses: ./.github/actions/setup-tooling
      - name: Install test dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install shell test dependency
        uses: ./.github/actions/apt-install
        with:
          packages: zsh
      - name: Build independent native process fixtures
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: rust
        run: |
          cargo build --locked -p tmt-squad
          cargo build --locked -p tmt-remote -p tmt-colab --bins
          cargo build --locked --example storage-probe --example runtime-caller-fixture
          cargo build --locked --release -p tmt-cli -p tmt-driver-herdr --bins
      - name: Build Squad process fixtures
        if: needs.changes.outputs.native_scope == 'squad'
        working-directory: rust
        run: |
          cargo build --locked -p tmt-squad
          cargo build --locked -p tmt-remote -p tmt-colab --bins
          cargo build --locked --release -p tmt-cli -p tmt-driver-herdr --bins
      - name: Download the verified Office companion
        if: needs.changes.outputs.native_scope == 'full' && needs.changes.outputs.native_office == 'true'
        uses: actions/download-artifact@v4
        with:
          name: native-office-companion
          path: .
      - name: Verify Office companion identity and executable mode
        if: needs.changes.outputs.native_scope == 'full' && needs.changes.outputs.native_office == 'true'
        working-directory: rust/target/debug
        run: |
          sha256sum --check tmt-office.sha256
          chmod +x tmt-office
      - name: Verify native process and shared parser contracts
        if: needs.changes.outputs.native_scope == 'full'
        working-directory: typescript
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/release/tmt","args":[]}'
          TMT_TEST_STORAGE_PROBE: '{"executable":"${{ github.workspace }}/rust/target/debug/examples/storage-probe","args":[]}'
          NATIVE_OFFICE_SELECTED: ${{ needs.changes.outputs.native_office }}
        run: |
          if [ "$NATIVE_OFFICE_SELECTED" = true ]; then
            pnpm test:native --reporter=verbose
          elif [ "$NATIVE_OFFICE_SELECTED" = false ]; then
            pnpm test:native --reporter=verbose --exclude 'test/native/office-*.test.ts'
          else
            echo 'Missing Office native selection' >&2
            exit 1
          fi
      - name: Verify Squad native contracts
        if: needs.changes.outputs.native_scope == 'squad'
        working-directory: typescript
        env:
          TMT_TEST_CLI: '{"executable":"${{ github.workspace }}/rust/target/release/tmt","args":[]}'
          # Plain file names from the component map, validated when it is parsed.
          SCOPED_NATIVE_TESTS: ${{ needs.changes.outputs.scoped_native_tests }}
        run: |
          # shellcheck disable=SC2086
          pnpm test:native --reporter=verbose $SCOPED_NATIVE_TESTS

  native-msrv:
    name: Native Rust MSRV
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the declared minimum Rust version
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')"
          printf 'MSRV=%s\nRUSTUP_TOOLCHAIN=%s\n' "$msrv" "$msrv" >> "$GITHUB_ENV"
      - name: Install the declared minimum Rust version
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust-msrv
          save-if: ${{ needs.changes.outputs.verify == 'false' && github.ref == 'refs/heads/main' }}
      - name: Check all workspace targets at MSRV
        working-directory: rust
        run: cargo +"$MSRV" check --locked --workspace --all-targets

  native-rust:
    name: Native Rust contracts
    needs:
      [
        changes,
        native-clippy,
        native-workspace-tests,
        native-office,
        native-process-tests,
        native-msrv,
      ]
    # Preserve the outer gate's skipped result for scope none. Missing selection
    # must still reach this gate and fail, even when all workers were skipped.
    if: ${{ always() && needs.changes.outputs.native_scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require every selected Rust worker
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          NATIVE_OFFICE_SELECTED: ${{ needs.changes.outputs.native_office }}
          CLIPPY_RESULT: ${{ needs.native-clippy.result }}
          TESTS_RESULT: ${{ needs.native-workspace-tests.result }}
          OFFICE_RESULT: ${{ needs.native-office.result }}
          NATIVE_RESULT: ${{ needs.native-process-tests.result }}
          MSRV_RESULT: ${{ needs.native-msrv.result }}
        run: node typescript/scripts/ci-scope.mjs gate-rust "$NATIVE_SCOPE" "$NATIVE_OFFICE_SELECTED" "$CLIPPY_RESULT" "$TESTS_RESULT" "$OFFICE_RESULT" "$NATIVE_RESULT" "$MSRV_RESULT"

  unit-tests:
    name: Unit tests
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install shell and linkage test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: zsh binutils
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Install pinned release-config test API
        working-directory: .github/release-please
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the native executable for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: runtime-x86_64-unknown-linux-musl
          path: rust/target/debug
      - name: Download the Rust TOML helper for injection fixtures
        uses: actions/download-artifact@v4
        with:
          name: release-version-fixture
          path: rust/target/debug/examples
      - name: Make the Rust TOML helper executable
        run: chmod +x rust/target/debug/examples/release-version
      - name: Download the native caller launcher for tooling tests
        uses: actions/download-artifact@v4
        with:
          name: native-caller-fixture-x86_64-unknown-linux-musl
          path: rust/target/debug/examples
      - name: Run retained developer tooling tests
        working-directory: typescript
        # The deleted TypeScript source coverage denominator is not Rust coverage.
        # Rust unit/process contracts and Docker remain independent required gates.
        run: |
          chmod +x ../rust/target/debug/tmt ../rust/target/debug/tmt-driver-herdr
          chmod +x ../rust/target/debug/examples/runtime-caller-fixture
          pnpm test:run

  # The Docker E2E suite runs as two jobs so that the longest required job is
  # about half as long. `docker-e2e` below is the required check named `Docker E2E`.
  docker-e2e-shard-1:
    name: Docker E2E shard 1/2
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Plain file names from typescript/scripts/e2e-shards.mjs (a shard of the full
      # suite, or the Squad scope's file). Only the first shard of a full run also runs
      # the Rust adapter tests.
      TMT_E2E_FILES: ${{ needs.changes.outputs.e2e_shard_1 }}
      TMT_E2E_ADAPTER_TESTS: ${{ needs.changes.outputs.native_scope == 'full' && '1' || '0' }}
    steps: &docker-e2e-steps
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install dependencies
        working-directory: typescript
        run: pnpm --filter tmux-team install --frozen-lockfile
      - name: Run Docker end-to-end tests
        working-directory: typescript
        run: pnpm test:e2e

  docker-e2e-shard-2:
    name: Docker E2E shard 2/2
    needs: changes
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMT_E2E_FILES: ${{ needs.changes.outputs.e2e_shard_2 }}
      TMT_E2E_ADAPTER_TESTS: '0'
    steps: *docker-e2e-steps

  docker-e2e:
    name: Docker E2E
    needs: [changes, docker-e2e-shard-1, docker-e2e-shard-2]
    if: ${{ always() && needs.changes.outputs.verify != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require every selected Docker E2E shard
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          SHARD_1_RESULT: ${{ needs.docker-e2e-shard-1.result }}
          SHARD_2_RESULT: ${{ needs.docker-e2e-shard-2.result }}
        run: |
          node typescript/scripts/ci-scope.mjs gate-e2e "$NATIVE_SCOPE" "$SHARD_1_RESULT" "$SHARD_2_RESULT"

  native-runtime-build:
    name: Build native runtime (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      # Linux targets; macOS has separate jobs so its skipped result is observable.
      # These are raw PR executables, not cargo-dist release archives.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: &native-runtime-build-steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: runtime-${{ matrix.target }}
          save-if: ${{ needs.changes.outputs.verify == 'false' && github.ref == 'refs/heads/main' }}
      - name: Build the reviewed native runtime
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          started=$SECONDS
          cargo build --locked --release --target '${{ matrix.target }}' -p tmt-cli -p tmt-driver-herdr --bins
          echo "Built native runtime in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the Rust TOML helper for tooling fixtures
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: cargo build --locked -p tmt-test-support --example release-version
      - name: Share the Rust TOML helper with tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: release-version-fixture
          path: rust/target/debug/examples/release-version
          if-no-files-found: error
          retention-days: 1
      - name: Build the native caller launcher for tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: cargo build --locked --release --target '${{ matrix.target }}' -p tmt-adapters --example runtime-caller-fixture
      - name: Share the native caller launcher with tooling tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: actions/upload-artifact@v4
        with:
          name: native-caller-fixture-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/examples/runtime-caller-fixture
          if-no-files-found: error
          retention-days: 1
      - name: Record the Cargo-owned version
        working-directory: rust
        run: |
          cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tmt-cli"))' > target/${{ matrix.target }}/release/version.txt
      - name: Share the same executable with matching runtime environments
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/tmt
            rust/target/${{ matrix.target }}/release/tmt-driver-herdr
            rust/target/${{ matrix.target }}/release/version.txt
          if-no-files-found: error
          retention-days: 1

  native-runtime-build-macos:
    name: Build native runtime (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.macos == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: *native-runtime-build-steps

  packed-native-install:
    # Preserve required historical check names while replacing the retired npm
    # product. Each row now executes native linkage/skill/SQLite runtime proof.
    name: Packed install (${{ matrix.label }})
    needs: [changes, native-runtime-build]
    if: needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux glibc x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: false
          - label: Linux glibc arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: false
          - label: Linux musl x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: true
          - label: Linux musl arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: &packed-native-install-steps
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Download the matching native executable
        uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: runtime
      - name: Restore executable permission
        run: chmod +x runtime/tmt
      - name: Install linkage inspection tool
        if: runner.os == 'Linux' && !matrix.container
        uses: ./.github/actions/apt-install
        with:
          packages: binutils
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Verify native runtime with the matching target process
        if: ${{ !matrix.container }}
        run: |
          scripts/run-native-verification.sh '${{ matrix.target }}' <<'VERIFY'
          started=$SECONDS
          node typescript/scripts/verify-native-runtime.mjs \
            --executable "$GITHUB_WORKSPACE/runtime/tmt" \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill skills/tmux-team/SKILL.md
          echo "Verified native runtime in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          VERIFY
      - name: Build the verification-only Alpine environment
        if: ${{ matrix.container }}
        run: docker build -f typescript/test/native/runtime.Dockerfile -t tmt-runtime-proof .
      - name: Verify the same static executable in matching native Alpine
        if: ${{ matrix.container }}
        run: |
          docker run --rm --init --network none \
            --volume "$GITHUB_WORKSPACE/runtime:/runtime:ro" \
            tmt-runtime-proof \
            --executable /runtime/tmt \
            --target '${{ matrix.target }}' \
            --version "$(cat runtime/version.txt)" \
            --skill /verification/skills/tmux-team/SKILL.md

  packed-native-install-macos:
    name: Packed install (${{ matrix.label }})
    needs: [changes, native-runtime-build-macos]
    if: needs.changes.outputs.macos == 'true' && needs.changes.outputs.verify == 'true' && needs.changes.outputs.native_scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS x64
            runner: macos-15
            target: x86_64-apple-darwin
            container: false
          - label: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            container: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps: *packed-native-install-steps

  native-install-gate:
    name: Native package matrix
    if: ${{ always() && needs.changes.outputs.verify != 'false' }}
    needs:
      [
        changes,
        native-rust,
        unit-tests,
        docker-e2e-shard-1,
        docker-e2e-shard-2,
        native-runtime-build,
        packed-native-install,
        native-runtime-build-macos,
        packed-native-install-macos,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require every selected native gate
        env:
          NATIVE_SCOPE: ${{ needs.changes.outputs.native_scope }}
          CONTRACT_RESULT: ${{ needs.native-rust.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SHARD_1_RESULT: ${{ needs.docker-e2e-shard-1.result }}
          SHARD_2_RESULT: ${{ needs.docker-e2e-shard-2.result }}
          BUILD_RESULT: ${{ needs.native-runtime-build.result }}
          MATRIX_RESULT: ${{ needs.packed-native-install.result }}
          MACOS_BUILD_RESULT: ${{ needs.native-runtime-build-macos.result }}
          MACOS_MATRIX_RESULT: ${{ needs.packed-native-install-macos.result }}
          MACOS_SELECTED: ${{ needs.changes.outputs.macos }}
        run: |
          node typescript/scripts/ci-scope.mjs gate-native "$MACOS_SELECTED" "$NATIVE_SCOPE" "$CONTRACT_RESULT" "$UNIT_RESULT" "$SHARD_1_RESULT" "$SHARD_2_RESULT" "$BUILD_RESULT" "$MATRIX_RESULT" "$MACOS_BUILD_RESULT" "$MACOS_MATRIX_RESULT"
