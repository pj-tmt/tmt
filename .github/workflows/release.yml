name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'Release cut (dry dispatch)' || 'Release cut (live dispatch)') || format('Release cut ({0})', github.event_name) }}

# Capture one exact main HEAD, then draft and dispatch each released component independently.
# This workflow creates no tag and publishes nothing; native-release retains every publication gate.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      product:
        description: Optional single released product for an owner-dispatched cut
        required: false
        default: all
        type: choice
        options: [all, cli, ops, driver-herdr, remote, colab]
      version:
        description: Optional explicit stable or alpha version; requires a product and owner authorization
        required: false
        default: ''
        type: string
      dry_run:
        description: Report proposed cuts and recovery without creating drafts or dispatching builds
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Each pending run recomputes main and release state. A replaced pending run loses no releasable commit coverage.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut releases from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      # Write visibility is required even for dry runs to enumerate drafts reliably.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether this run changes anything
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node typescript/scripts/release-mode.mjs
      - name: Admit live release cut
        if: steps.mode.outputs.live == 'true'
        run: echo 'Live release cut admitted.'
      - uses: ./.github/actions/setup-tooling
        if: steps.mode.outputs.reason != 'cadence'
      - name: Install reviewed release parsing and rendering dependencies
        if: steps.mode.outputs.reason != 'cadence'
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned metadata toolchain
        if: steps.mode.outputs.reason != 'cadence'
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore dependency cache for locked source acquisition
        if: steps.mode.outputs.reason != 'cadence'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Draft immutable source cuts and dispatch their native gates
        if: steps.mode.outputs.reason != 'cadence'
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.mode.outputs.live }}
          PRODUCT: ${{ inputs.product != 'all' && inputs.product || '' }}
          VERSION: ${{ inputs.version }}
        run: node typescript/scripts/release-cut-live.mjs > "$RUNNER_TEMP/release-cut-plan.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.mode.outputs.reason != 'cadence'
        with:
          name: release-cut-plan
          path: ${{ runner.temp }}/release-cut-plan.json
          if-no-files-found: warn
          retention-days: 7
