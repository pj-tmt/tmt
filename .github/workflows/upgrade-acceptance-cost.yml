name: Upgrade acceptance compile cost

on:
  pull_request:
    paths:
      - .github/workflows/upgrade-acceptance-cost.yml

permissions:
  contents: read

jobs:
  measure:
    name: Compile cost (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Record the compilation toolchain
        working-directory: rust
        run: rustc --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: release-source
      - uses: ./.github/actions/setup-tooling
      - name: Install verifier dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Stage public matching-host archives without credentials
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync, copyFileSync } from 'node:fs';
          import path from 'node:path';
          import { fetchUpgrade } from './typescript/scripts/release-upgrade.mjs';
          const target = process.env.TARGET;
          const directory = path.join(process.env.RUNNER_TEMP, 'upgrade');
          const downloads = new Map();
          // Immutable metadata read via gh api repos/pj-tmt/tmt/releases/tags/{tag}; no CI API request or credential.
          const releases = [{"assets":[{"browser_download_url":"https://github.com/pj-tmt/tmt/releases/download/v5.0.0-alpha.44/dist-manifest.json","digest":"sha256:41aadff4bb4eebafd5a8f426f250e5598ad2f056489dadf036582658d82591e2","id":607178370,"name":"dist-manifest.json"},{"browser_download_url":"https://github.com/pj-tmt/tmt/releases/download/v5.0.0-alpha.44/tmt-cli-aarch64-apple-darwin.tar.gz","digest":"sha256:fa6390dec4a65ef49c34e31497922ea7faab4e4f6c88d9d89b9a1bbda1876cc1","id":607178296,"name":"tmt-cli-aarch64-apple-darwin.tar.gz"}],"draft":false,"immutable":true,"prerelease":false,"tag_name":"v5.0.0-alpha.44"},{"assets":[{"browser_download_url":"https://github.com/pj-tmt/tmt/releases/download/v5.0.0-alpha.45/dist-manifest.json","digest":"sha256:603d8171165ae098910955529f203878e496b5c23bcb16033339be4fcc373405","id":607225203,"name":"dist-manifest.json"},{"browser_download_url":"https://github.com/pj-tmt/tmt/releases/download/v5.0.0-alpha.45/tmt-cli-aarch64-apple-darwin.tar.gz","digest":"sha256:1fc5730df30acf04bd737e89f136b71c8a9d2eb5dd6608f4d7882fedcc4d5851","id":607225094,"name":"tmt-cli-aarch64-apple-darwin.tar.gz"}],"draft":false,"immutable":true,"prerelease":false,"tag_name":"v5.0.0-alpha.45"}];
          for (const release of releases) {
            const tag = release.tag_name;
            for (const asset of release.assets) {
              const response = await fetch(asset.browser_download_url);
              if (!response.ok) throw new Error(`Public asset read failed: ${response.status}`);
              const file = path.join(directory, 'downloads', tag, asset.name);
              mkdirSync(path.dirname(file), { recursive: true });
              writeFileSync(file, Buffer.from(await response.arrayBuffer()));
              downloads.set(asset.id, file);
            }
          }
          fetchUpgrade({ releases, product: 'cli', tag: 'v5.0.0-alpha.45', directory,
            download: (asset, file) => copyFileSync(downloads.get(asset.id), file) });
          JS
      - name: Measure existing installer and migration proof
        run: |
          set -o pipefail
          started=$(date +%s)
          node typescript/scripts/release-upgrade.mjs prove --product cli --tag v5.0.0-alpha.45 \
            --target '${{ matrix.target }}' --directory "$RUNNER_TEMP/upgrade" \
            --source-root "$GITHUB_WORKSPACE/release-source" \
            --skill "$GITHUB_WORKSPACE/skills/tmux-team/SKILL.md" \
            2>&1 | tee "$RUNNER_TEMP/baseline-proof.log"
          printf 'before proof: %s seconds\n' "$(( $(date +%s) - started ))" | tee -a "$RUNNER_TEMP/compile-cost.txt" "$GITHUB_STEP_SUMMARY"
      - name: Measure cold and warm real-archive acceptance
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/upgrade-acceptance-target
        run: |
          set -o pipefail
          for temperature in cold warm; do
            started=$(date +%s)
            CARGO_BUILD_JOBS=2 node typescript/scripts/release-upgrade.mjs acceptance --product cli --tag v5.0.0-alpha.45 \
              --target "$TARGET" --directory "$RUNNER_TEMP/upgrade" \
              --source-root "$GITHUB_WORKSPACE/release-source" \
              2>&1 | tee "$RUNNER_TEMP/$temperature-compile.log"
            seconds=$(( $(date +%s) - started ))
            printf '%s %s added acceptance: %s seconds\n' "$TARGET" "$temperature" "$seconds" | tee -a "$RUNNER_TEMP/compile-cost.txt" "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep compile measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-acceptance-cost-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/compile-cost.txt
            ${{ runner.temp }}/*-compile.log
            ${{ runner.temp }}/baseline-proof.log
          if-no-files-found: error
          retention-days: 7
