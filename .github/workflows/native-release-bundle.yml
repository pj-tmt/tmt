name: Native release bundle

# One pipeline for one product: build and verify the four targets, assemble the
# authoritative manifest, verify the final bundle on matching hosts and, for a draft
# release, attach it, evaluate the publication gates, publish it and check the published
# release. Called once per draft by `native-release.yml`, which owns the per-product concurrency
# group; a group here would cancel the legs of its own caller. A draft that passes the gates is
# published under the owner's standing alpha authorization (the release skill); one that fails
# is held and stays a draft until the owner acts.
on:
  workflow_call:
    inputs:
      product:
        description: Native product to build
        required: true
        type: string
      tag:
        description: Draft release to build and attach to; empty prepares a bundle for the current main commit without a release
        required: false
        default: ''
        type: string
      sha:
        description: Commit the draft release points at; empty builds the current main commit
        required: false
        default: ''
        type: string
      retry:
        description: Retry a draft whose failure was recorded
        required: false
        default: false
        type: boolean
      hold:
        description: Run the publication gates again for a complete draft whose publication was held, without the gate its marker names
        required: false
        default: false
        type: boolean

      rerun:
        description: Rerun every gate of a held draft with current main tooling
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ inputs.tag || 'main commit' }}
    # A draft is only built while it has no bundle and no recorded failure. The run planned
    # before it held the product's group, so this is the check that counts.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      todo: ${{ steps.check.outputs.todo }}
      awaiting: ${{ steps.check.outputs.awaiting }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Check the draft release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RETRY: ${{ inputs.retry }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo 'todo=true' >> "$GITHUB_OUTPUT"
          elif [ "$RETRY" = true ]; then
            node typescript/scripts/release-draft-assets.mjs check --tag "$RELEASE_TAG" --retry
          else
            node typescript/scripts/release-draft-assets.mjs check --tag "$RELEASE_TAG"
          fi

  build:
    name: Build ${{ inputs.product }} (${{ matrix.target }})
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.todo == 'true'
    strategy:
      fail-fast: false
      matrix: &native-targets
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Set up Node.js and pnpm for embedded Office assets
        if: inputs.product == 'office'
        uses: ./.github/actions/setup-tooling
      - name: Install embedded Office build dependencies
        if: inputs.product == 'office'
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Per product: each product compiles a different set of dependencies, and a cache
          # that another product saved first would stay incomplete. Only main writes it.
          shared-key: release-${{ inputs.product }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache packaging tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
      - name: Build pinned packaging tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo +1.97.0 install cargo-dist --version 0.32.0 --locked --root "$HOME/.tmt-packaging"
          cargo +1.97.0 install cargo-about --version 0.9.2 --features cli --locked --root "$HOME/.tmt-packaging"
      - name: Build release archive and target manifest
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          export PATH="$HOME/.tmt-packaging/bin:$PATH"
          started=$SECONDS
          cargo +1.97.0 fetch --manifest-path rust/Cargo.toml --locked
          scripts/build-native-artifact.sh "$TARGET" "$PRODUCT" > "$RUNNER_TEMP/$TARGET-dist-manifest.json"
          cp "$RUNNER_TEMP/$TARGET-dist-manifest.json" target/distrib/
          cp rust/target/native-notices/THIRD-PARTY-NOTICES.txt "target/distrib/$TARGET-notices.txt"
          echo "Built the $PRODUCT archive for $TARGET in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.product }}-${{ matrix.target }}-${{ inputs.tag || 'main' }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.sha256
            target/distrib/*-dist-manifest.json
            target/distrib/*-notices.txt
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble authoritative ${{ inputs.product }} release manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
          fail-on-cache-miss: true
      - name: Install verification dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-${{ inputs.product }}-*-${{ inputs.tag || 'main' }}
          merge-multiple: true
          path: target/distrib
      - name: Merge with cargo-dist and verify bootstrap inputs
        env:
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          export PATH="$HOME/.tmt-packaging/bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.97.0
          TMT_NATIVE_REAL_CARGO=$(command -v cargo)
          export TMT_NATIVE_REAL_CARGO
          export CARGO="$GITHUB_WORKSPACE/scripts/native-cargo.sh"
          package="tmt-$PRODUCT"
          export PACKAGE="$package"
          version=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | node -pe 'const p=process.env.PACKAGE; JSON.parse(require("fs").readFileSync(0,"utf8")).packages.find(x => x.name === p).version')
          tag="v$version"
          if [ "$PRODUCT" != cli ]; then tag="tmt-$PRODUCT-v$version"; fi
          # A draft release must be for the version its commit declares.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$tag" ]; then
            echo "Draft release $RELEASE_TAG is not the $tag that this commit declares." >&2
            exit 1
          fi
          dist plan --tag "$tag" --output-format=json --no-local-paths > "$RUNNER_TEMP/plan.json"
          dist build --tag "$tag" --artifacts global --output-format=json --no-local-paths > "$RUNNER_TEMP/dist-manifest.json"
          cp "$RUNNER_TEMP/dist-manifest.json" target/distrib/dist-manifest.json
          # How this product's GitHub release must be published (#333): only the
          # CLI becomes the repository's latest release.
          node typescript/scripts/release-policy.mjs --product "$PRODUCT" > target/distrib/release-publication.json
          if [ "$PRODUCT" = cli ]; then
            node typescript/scripts/generate-native-bootstrap.mjs --manifest target/distrib/dist-manifest.json --archive-dir target/distrib --plan "$RUNNER_TEMP/plan.json" > target/distrib/tmt-installer.sh
            sh -n target/distrib/tmt-installer.sh
            shellcheck --shell sh target/distrib/tmt-installer.sh
            # The same verified bootstrap under the name the one-line install uses.
            cp target/distrib/tmt-installer.sh target/distrib/install.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag || 'main' }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.sha256
            target/distrib/sha256.sum
            target/distrib/dist-manifest.json
            target/distrib/release-publication.json
            target/distrib/tmt-installer.sh
            target/distrib/install.sh
            target/distrib/*-notices.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify final ${{ inputs.product }} bundle (${{ matrix.target }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix: *native-targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install verification dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag || 'main' }}
          path: target/distrib
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Execute final archive and bootstrap on matching native host
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
        run: |
          node typescript/scripts/release-policy.mjs --product "$PRODUCT" | cmp - target/distrib/release-publication.json
          if [ "$PRODUCT" = cli ]; then
            node typescript/scripts/verify-native-artifact.mjs \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-cli-$TARGET.tar.gz" --target "$TARGET" \
              --skill skills/tmux-team/SKILL.md --license LICENSE \
              --notices "target/distrib/$TARGET-notices.txt"
            node typescript/scripts/verify-native-bootstrap.mjs \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-cli-$TARGET.tar.gz" --target "$TARGET" \
              --skill skills/tmux-team/SKILL.md
            node typescript/scripts/generate-native-bootstrap.mjs --manifest target/distrib/dist-manifest.json --archive-dir target/distrib > "$RUNNER_TEMP/installer.sh"
            cmp "$RUNNER_TEMP/installer.sh" target/distrib/tmt-installer.sh
            cmp target/distrib/tmt-installer.sh target/distrib/install.sh
          elif [ "$PRODUCT" = squad ]; then
            node typescript/scripts/verify-native-artifact.mjs \
              --product squad \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-squad-$TARGET.tar.gz" --target "$TARGET" \
              --skills extensions/tmt-squad/skills --license LICENSE \
              --notices "target/distrib/$TARGET-notices.txt"
          elif [ "$PRODUCT" = driver-herdr ]; then
            node typescript/scripts/verify-native-artifact.mjs \
              --product driver-herdr \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-driver-herdr-$TARGET.tar.gz" --target "$TARGET" \
              --license LICENSE \
              --notices "target/distrib/$TARGET-notices.txt"
          else
            node typescript/scripts/verify-native-artifact.mjs \
              --product office \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-office-$TARGET.tar.gz" --target "$TARGET" \
              --license LICENSE \
              --notices "target/distrib/$TARGET-notices.txt"
          fi

  attach:
    name: Attach the verified ${{ inputs.product }} bundle to ${{ inputs.tag }}
    # Only after every verify job passed. Uploading to a draft is not publication; the marker
    # file goes last, so a draft that has it has everything.
    needs: [check, verify]
    if: inputs.tag != '' && needs.check.outputs.todo == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag }}
          path: target/distrib
      - name: Attach the bundle to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node typescript/scripts/release-draft-assets.mjs attach --product "$PRODUCT" --tag "$RELEASE_TAG" --directory target/distrib

  record-failure:
    name: Record a failure on ${{ inputs.tag }}
    # A failed job parks the draft, so later runs skip it instead of rebuilding a known-bad
    # commit; a cancelled run records nothing and is retried.
    needs: [check, build, assemble, verify, attach]
    if: always() && inputs.tag != '' && needs.check.outputs.todo == 'true' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Record the failure on the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq ".jobs[] | select(.conclusion == \"failure\" and (.name | startswith(\"Release $RELEASE_TAG /\"))) | .name" | paste -sd, -)
          node typescript/scripts/release-draft-assets.mjs record-failure --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jobs "$jobs"

  # The gates a complete draft passes before anything may publish it: a draft that passes them is
  # published by the next jobs, one that fails is held with `publication-held.json` and is neither
  # built again nor published until the owner acts. A complete draft without a hold that an
  # earlier run did not publish ("awaiting") is checked again here. A job that follows a skipped
  # job is skipped too unless its own condition says otherwise, and `attach` is skipped when a
  # held or awaiting draft is checked, so these jobs name what they need.
  gates:
    name: Publication gates for ${{ inputs.tag }}
    needs: [check, attach]
    if: ${{ !cancelled() && inputs.tag != '' && needs.check.result == 'success' && ((needs.check.outputs.todo == 'true' && needs.attach.result == 'success') || inputs.hold || inputs.rerun || needs.check.outputs.awaiting == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Drafts are only visible to a token that can push, and a hold marker is uploaded to the draft.
      contents: write
      pull-requests: read
      checks: read
    outputs:
      held: ${{ steps.gates.outputs.held }}
      skip: ${{ steps.gates.outputs.skip }}
      rerun_gate: ${{ steps.gates.outputs.rerun_gate }}
    steps:
      # This repository's own ref with its whole history: the gates read the release commit's
      # data through git and the API and never run its code.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Evaluate the commit, immutability, monotonic and migration gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
          HOLD: ${{ inputs.hold }}
          RERUN: ${{ inputs.rerun }}
        run: |
          if [ "$HOLD" = true ]; then
            node typescript/scripts/publication-gates.mjs early --product "$PRODUCT" --tag "$RELEASE_TAG" --release-hold
          elif [ "$RERUN" = true ]; then
            node typescript/scripts/publication-gates.mjs early --product "$PRODUCT" --tag "$RELEASE_TAG" --rerun
          else
            node typescript/scripts/publication-gates.mjs early --product "$PRODUCT" --tag "$RELEASE_TAG"
          fi

  upgrade:
    name: Upgrade proof for ${{ inputs.tag }}
    needs: gates
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.gates.outputs.held == '' && needs.gates.outputs.skip != 'upgrade' }}
    permissions:
      # The proof's fetch job sees draft assets with it and checks out this repository's own ref.
      contents: write
    uses: ./.github/workflows/native-release-upgrade.yml
    with:
      product: ${{ inputs.product }}
      tag: ${{ inputs.tag }}
      sha: ${{ inputs.sha }}
      current-tooling: ${{ inputs.rerun }}

  finish:
    name: Decide the publication of ${{ inputs.tag }}
    needs: [gates, upgrade]
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.gates.outputs.held == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      held: ${{ steps.finish.outputs.held }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Hold the draft, or report that every gate passed
        id: finish
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
          UPGRADE_OUTCOME: ${{ needs.upgrade.outputs.outcome }}
          UPGRADE_REASON: ${{ needs.upgrade.outputs.reason }}
          SKIP: ${{ needs.gates.outputs.skip }}
          RERUN_GATE: ${{ needs.gates.outputs.rerun_gate }}
        run: |
          node typescript/scripts/publication-gates.mjs finish --product "$PRODUCT" --tag "$RELEASE_TAG" \
            --upgrade-result "$UPGRADE_RESULT" --upgrade-outcome "$UPGRADE_OUTCOME" \
            --upgrade-reason "$UPGRADE_REASON" --skip "$SKIP" --rerun-gate "$RERUN_GATE"

  # The one job that publishes. It runs only when `finish` ran and held nothing, which takes every
  # gate to have passed, and the script reads the draft again before it acts. Like the gates it
  # holds the write token, so it runs this repository's main and never the release commit's code.
  publish:
    name: Publish ${{ inputs.tag }}
    needs: finish
    if: ${{ !cancelled() && inputs.tag != '' && needs.finish.result == 'success' && needs.finish.outputs.held == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Publish the draft under the product's policy
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node typescript/scripts/release-publish.mjs publish --product "$PRODUCT" --tag "$RELEASE_TAG"

  # A published release cannot be rolled back, so a failed check opens an issue and fails the run
  # for the owner; it does not stop later drafts, whose own gates decide (the immutability gate
  # holds them while the newest published release is not immutable).
  published:
    name: Check the published ${{ inputs.tag }}
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Check immutability, flags, tag and attestation of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node typescript/scripts/release-publish.mjs verify --product "$PRODUCT" --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/published" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # The published release is installed the way a user installs it: the public installer and
  # `tmt upgrade` for the CLI, the newest published CLI's extension install for an extension. It
  # reads the public release only; a failure opens or updates the issue of the checks above.
  smoke:
    name: Install the published ${{ inputs.tag }}
    needs: published
    if: ${{ !cancelled() && needs.published.result == 'success' }}
    permissions:
      contents: read
      issues: write
      actions: write
    uses: ./.github/workflows/native-release-smoke.yml
    with:
      product: ${{ inputs.product }}
      tag: ${{ inputs.tag }}

  # Dispatch is exempt from GITHUB_TOKEN event suppression. Wait for read-back and
  # the entire smoke workflow; classified rate limits keep the smoke failure visible.
  project-release:
    name: Reconcile Project release state
    needs: [published, smoke]
    if: ${{ !cancelled() && needs.published.result == 'success' && (needs.smoke.result == 'success' || (needs.smoke.result == 'failure' && needs.smoke.outputs.outcome == 'infrastructure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the full Project sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/project-release.yml/dispatches" \
            --method POST --input - <<'JSON'
          {"ref":"main","inputs":{"dry_run":"false"}}
          JSON
