name: Upgrade floor PR rehearsal

# Temporary #1455 acceptance only: no secrets, release/tag mutation or dispatch.
# Run 37142099941 built all four archives and pinned tools from CANDIDATE_SHA.
# Reuse those unchanged artifacts while fixing assembly; every proof rechecks digests.
on:
  pull_request:
    paths:
      - '.github/workflows/upgrade-floor-rehearsal.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: upgrade-floor-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 0ed71ea7b039a7a635df6cd2b847b963f70d7e79
  CANDIDATE_TAG: v5.0.0-alpha.999
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  assemble:
    name: Assemble rehearsal assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: release-source
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
      - name: Install frozen tooling
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Select isolated Cargo target
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/release-source/rust/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: release-source/rust
          shared-key: native-rust
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: floor-assembly-tools
          run-id: 37142099941
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/assembly-tools
      - name: Extract pinned assembly tools
        run: |
          mkdir "$RUNNER_TEMP/packaging"
          tar -xzf "$RUNNER_TEMP/assembly-tools/packaging-tools.tar.gz" -C "$RUNNER_TEMP/packaging"
          test "$("$RUNNER_TEMP/packaging/bin/dist" --version)" = 'cargo-dist 0.32.0'
          test "$("$RUNNER_TEMP/packaging/bin/cargo-about" --version)" = 'cargo-about 0.9.2'
      - uses: actions/download-artifact@v4
        with:
          pattern: floor-candidate-*
          run-id: 37142099941
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-source/target/distrib
      - name: Merge with cargo-dist and stage recorded sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/packaging/bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.97.0
          cargo fetch --locked --manifest-path release-source/rust/Cargo.toml
          cargo build --locked --manifest-path release-source/rust/Cargo.toml -p tmt-test-support --example release-version
          node typescript/scripts/release-version-injection.mjs prepare "$PWD/release-source" "$RUNNER_TEMP/version-state.json" cli "$CANDIDATE_TAG"
          cargo update --offline --workspace --manifest-path release-source/rust/Cargo.toml
          node typescript/scripts/release-version-injection.mjs verify "$PWD/release-source" "$RUNNER_TEMP/version-state.json"
          (
            cd release-source
            TMT_NATIVE_REAL_CARGO=$(command -v cargo)
            export TMT_NATIVE_REAL_CARGO
            export CARGO="$PWD/scripts/native-cargo.sh"
            dist plan --tag "$CANDIDATE_TAG" --output-format=json --no-local-paths > "$RUNNER_TEMP/plan.json"
            dist build --tag "$CANDIDATE_TAG" --artifacts global --output-format=json --no-local-paths > "$RUNNER_TEMP/dist-manifest.json"
            cp "$RUNNER_TEMP/dist-manifest.json" target/distrib/dist-manifest.json
          )
          node typescript/scripts/generate-native-bootstrap.mjs --manifest release-source/target/distrib/dist-manifest.json --archive-dir release-source/target/distrib --plan "$RUNNER_TEMP/plan.json" > release-source/target/distrib/install.sh
          sh -n release-source/target/distrib/install.sh
          node --input-type=module <<'STAGE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { ghApi } from './typescript/scripts/release-draft-assets.mjs';
          import { fetchUpgrade, ghAssetDownloader } from './typescript/scripts/release-upgrade.mjs';
          const directory = path.resolve('release-source/target/distrib');
          const assets = fs.readdirSync(directory).filter(name => name.endsWith('.tar.gz') || ['install.sh', 'dist-manifest.json'].includes(name)).map(name => ({name, local: path.join(directory, name), digest: `sha256:${createHash('sha256').update(fs.readFileSync(path.join(directory, name))).digest('hex')}`}));
          const releases = ghApi({repository: process.env.GITHUB_REPOSITORY}).listReleases();
          const candidate = {tag_name: process.env.CANDIDATE_TAG, draft: true, prerelease: false, assets};
          const download = ghAssetDownloader({repository: process.env.GITHUB_REPOSITORY});
          const plan = fetchUpgrade({releases: [candidate, ...releases], product: 'cli', tag: candidate.tag_name, directory: path.join(process.env.RUNNER_TEMP, 'upgrade-assets'), download: (asset, file) => asset.local ? fs.copyFileSync(asset.local, file) : download(asset, file)});
          for (const target of Object.keys(plan.files).map(name => name.split('/')[0]).filter((target, index, targets) => targets.indexOf(target) === index)) {
            const name = `${target}/candidate/${target}-notices.txt`;
            fs.copyFileSync(path.join(directory, `${target}-notices.txt`), path.join(process.env.RUNNER_TEMP, 'upgrade-assets', name));
            plan.files[name] = `sha256:${createHash('sha256').update(fs.readFileSync(path.join(directory, `${target}-notices.txt`))).digest('hex')}`;
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'upgrade-assets/plan.json'), `${JSON.stringify(plan, null, 2)}\n`);
          console.log(JSON.stringify(plan, null, 2));
          STAGE
      - uses: actions/upload-artifact@v4
        with:
          name: floor-rehearsal-assets
          path: ${{ runner.temp }}/upgrade-assets
          if-no-files-found: error
          retention-days: 7

  prove:
    name: Rehearsal prove (${{ matrix.target }})
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: release-source
          persist-credentials: false
      - uses: ./.github/actions/setup-tooling
        with:
          architecture: ${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Install frozen tooling
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Select isolated Cargo target
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/release-source/rust/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0
        with:
          workspaces: release-source/rust
          shared-key: native-rust
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: floor-rehearsal-assets
          path: ${{ runner.temp }}/upgrade
      - name: Execute archive, source recovery and adapter proofs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/run-native-verification.sh "$TARGET" <<'VERIFY'
          set -euo pipefail
          started=$SECONDS
          assets="$RUNNER_TEMP/upgrade/$TARGET/candidate"
          node typescript/scripts/verify-native-artifact.mjs --manifest "$assets/dist-manifest.json" --archive "$assets/tmt-cli-$TARGET.tar.gz" --target "$TARGET" --skill release-source/skills/tmux-team/SKILL.md --license release-source/LICENSE --notices "$assets/$TARGET-notices.txt" --source-root "$PWD/release-source"
          node typescript/scripts/release-upgrade.mjs prove --product cli --tag "$CANDIDATE_TAG" --target "$TARGET" --directory "$RUNNER_TEMP/upgrade" --source-root "$PWD/release-source" --skill release-source/skills/tmux-team/SKILL.md 2>&1 | tee "$RUNNER_TEMP/upgrade-proof.log"
          node typescript/scripts/release-upgrade.mjs acceptance --product cli --tag "$CANDIDATE_TAG" --target "$TARGET" --directory "$RUNNER_TEMP/upgrade" --source-root "$PWD/release-source" 2>&1 | tee -a "$RUNNER_TEMP/upgrade-proof.log"
          echo "Total matching-host proof ($TARGET): $((SECONDS - started)) seconds." | tee -a "$RUNNER_TEMP/upgrade-proof.log" "$GITHUB_STEP_SUMMARY"
          VERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor-rehearsal-log-${{ matrix.target }}
          path: ${{ runner.temp }}/upgrade-proof.log
          if-no-files-found: warn
          retention-days: 7
