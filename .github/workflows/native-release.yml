name: Native release artifacts

# The per-product release run. It builds and verifies the draft releases of one product
# that lack a verified bundle, attaches the bundle to each draft and evaluates its publication
# gates; it never publishes. A dispatch with `hold` runs the gates again for a held draft.
# Publishing a reviewed bundle is a separate, authorized operation, and ordinary pull
# requests do not run this costly matrix.
#
# The group holds the whole run and queues rather than cancels. GitHub keeps one pending run
# per group and replaces it when another arrives, which loses nothing: a run plans from the
# markers on the drafts when it starts, after it holds the group, so the run that replaced it
# plans the same drafts. A group on the jobs of a matrix would not work: while the group is
# busy each pending leg is replaced by the next leg, and the oldest draft would be dropped.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Native product to build
        required: true
        default: cli
        type: choice
        options:
          - cli
          - office
          - squad
      prepare:
        description: Build and verify one bundle from this main commit, without a draft release; nothing is attached
        required: true
        default: true
        type: boolean
      retry:
        description: Tag of a parked draft release to build again (turn prepare off)
        required: false
        default: ''
        type: string
      hold:
        description: Tag of a complete draft whose publication is held; runs its gates again without the gate its marker names (turn prepare off)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.product }} builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft releases are only listed for a token that can push.
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Plan the draft releases to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          PREPARE: ${{ inputs.prepare }}
          RETRY: ${{ inputs.retry }}
          HOLD: ${{ inputs.hold }}
        run: |
          if [ "$PREPARE" = true ]; then
            if [ -n "$RETRY" ] || [ -n "$HOLD" ]; then
              echo 'A retry and a released hold need prepare turned off.' >&2
              exit 1
            fi
            # One pipeline for this main commit, no draft release.
            printf '%s\n' 'matrix={"include":[{"tag":"","sha":""}]}' 'any=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$RETRY" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | node typescript/scripts/plan-release-builds.mjs --product "$PRODUCT" --retry "$RETRY"
          elif [ -n "$HOLD" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | node typescript/scripts/plan-release-builds.mjs --product "$PRODUCT" --hold "$HOLD"
          else
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | node typescript/scripts/plan-release-builds.mjs --product "$PRODUCT"
          fi

  bundle:
    name: Release ${{ matrix.tag || 'main commit' }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      # Oldest first, one at a time; a failed draft does not stop the next.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      # Granted to the jobs of the called workflow that upload to the draft and read its commit.
      contents: write
      actions: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/native-release-bundle.yml
    with:
      product: ${{ inputs.product }}
      tag: ${{ matrix.tag }}
      sha: ${{ matrix.sha }}
      retry: ${{ inputs.retry != '' && inputs.retry == matrix.tag }}
      hold: ${{ inputs.hold != '' && inputs.hold == matrix.tag }}
