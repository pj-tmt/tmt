name: Native release artifacts
run-name: 'Native release: ${{ inputs.tag || inputs.retry || inputs.hold || inputs.rerun || inputs.product }}'

# Each allocated tag owns one independent pipeline. Failed or held drafts remain unpublished
# without preventing later cuts. Owner retry/hold/rerun selects exactly one existing tag.
# Preparation has no draft and no publishing identity; its run ID isolates its concurrency.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Native product to build
        required: true
        default: cli
        type: choice
        options:
          - cli
          - ops
          - driver-herdr
          - remote
          - colab
      tag:
        description: Exact allocated draft tag to build and publish (turn prepare off)
        required: false
        default: ''
        type: string
      prepare:
        description: Build and verify one bundle from this main commit, without a draft release; nothing is attached
        required: true
        default: true
        type: boolean
      retry:
        description: Tag of a parked draft release to build again (turn prepare off)
        required: false
        default: ''
        type: string
      hold:
        description: Tag of a complete draft whose publication is held; runs its gates again without the gate its marker names (turn prepare off)
        required: false
        default: ''
        type: string

      rerun:
        description: Owner-authorized rerun of every gate for a held draft using current main tooling (turn prepare off)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || inputs.retry || inputs.hold || inputs.rerun || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.product }} builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft releases are only listed for a token that can push.
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Plan the draft releases to build or publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          PREPARE: ${{ inputs.prepare }}
          RELEASE_TAG: ${{ inputs.tag }}
          RETRY: ${{ inputs.retry }}
          HOLD: ${{ inputs.hold }}
          RERUN: ${{ inputs.rerun }}
        run: |
          # Only released products may enter either preparation or draft publication.
          node typescript/scripts/native-release-policy.mjs require-released "$PRODUCT"
          if [ "$PREPARE" = true ]; then
            if [ -n "$RELEASE_TAG" ] || [ -n "$RETRY" ] || [ -n "$HOLD" ] || [ -n "$RERUN" ]; then
              echo 'tag, retry, hold and rerun need prepare turned off.' >&2
              exit 1
            fi
            # One pipeline for this main commit, no draft release.
            printf '%s\n' 'matrix={"include":[{"tag":"","sha":""}]}' 'any=true' >> "$GITHUB_OUTPUT"
          else
            if [ -z "$RELEASE_TAG$RETRY$HOLD$RERUN" ]; then
              echo 'Publication requires an exact allocated tag, retry, hold or rerun.' >&2
              exit 1
            fi
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | node typescript/scripts/plan-release-builds.mjs \
              --product "$PRODUCT" --tag "$RELEASE_TAG" --retry "$RETRY" --hold "$HOLD" --rerun "$RERUN"
          fi

  bundle:
    name: Release ${{ matrix.tag || 'main commit' }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      # The plan names exactly one tag; other tag pipelines run independently.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      # Granted to the jobs of the called workflow that upload to the draft, publish it, read its
      # commit and open an issue for a failed check of the published release.
      # Only the called Project dispatch job requests actions: write.
      contents: write
      actions: write
      pull-requests: read
      checks: read
      issues: write
    uses: ./.github/workflows/native-release-bundle.yml
    with:
      product: ${{ inputs.product }}
      tag: ${{ matrix.tag }}
      sha: ${{ matrix.sha }}
      retry: ${{ inputs.retry != '' && inputs.retry == matrix.tag }}
      hold: ${{ inputs.hold != '' && inputs.hold == matrix.tag }}
      rerun: ${{ inputs.rerun != '' && inputs.rerun == matrix.tag }}
