name: Docker E2E dependency cache

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - rust/Cargo.lock
      - rust/rust-toolchain.toml
      - '**/.cargo/config.toml'
      - typescript/test/e2e/Dockerfile
      - .dockerignore
      - .github/workflows/e2e-dependency-cache.yml

permissions:
  contents: read

concurrency:
  group: e2e-dependency-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.29.1
      - name: Seed only native E2E dependencies
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: typescript/test/e2e/Dockerfile
          target: ci-dependencies
          cache-from: type=gha,version=2,scope=tmt-e2e-dependencies
          cache-to: type=gha,version=2,scope=tmt-e2e-dependencies,mode=min
