name: Native release upgrade proof stages

# The four-host proof of a staged candidate and the conclusion that names why it failed or could
# not run. Called by `native-release-upgrade.yml` for a draft or published release (after its
# write-token fetch) and by `native-release-prepare.yml` for a rehearsal candidate (after its
# read-only local fetch), so both prove with the same jobs. Only successful main Darwin CLI proofs
# save adapter dependencies; release-state proof has no release token and never reads release state.
on:
  workflow_call:
    inputs:
      product:
        description: Native product of the release
        required: true
        type: string
      tag:
        description: Release to prove, or the synthetic tag of a rehearsal candidate
        required: true
        type: string
      sha:
        description: Commit the candidate was made from, resolved by the caller's fetch
        required: true
        type: string
      outcome:
        description: The fetch outcome (proved, nothing or predates)
        required: true
        type: string
      fetch-reason:
        description: Why the fetch found the proof cannot run; empty otherwise
        required: false
        default: ''
        type: string
      current-tooling:
        description: Use this main run's scripts with release-source data (owner-authorized held-draft rerun)
        required: false
        default: false
        type: boolean
    outputs:
      reason:
        description: Why the proof could not run, or why a host failed it (the first error its log shows), worded for the owner; empty when it ran and passed or was not needed
        value: ${{ jobs.conclude.outputs.reason }}

permissions:
  contents: read

jobs:
  prove:
    name: Upgrade ${{ inputs.product }} to ${{ inputs.tag }} (${{ matrix.target }})
    if: inputs.outcome == 'proved'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 13
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/release-source/rust/target
    defaults:
      run:
        working-directory: release-source
    steps:
      # Main owns injection; ordinary proof uses cut tooling, while rerun uses repaired main tooling.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # Candidate data and Rust adapter acceptance stay at the release commit on reruns.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
          path: release-source
      - name: Require candidate Rosetta tooling
        if: ${{ matrix.target == 'x86_64-apple-darwin' && !inputs.current-tooling }}
        run: |
          if [ ! -x scripts/run-native-verification.sh ]; then
            echo '::error::candidate predates #547 Rosetta tooling; the owner reruns with native-release rerun=<tag>'
            exit 1
          fi
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
        with:
          architecture: ${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Install verification dependencies
        working-directory: typescript
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            "$GITHUB_WORKSPACE/scripts/install-native-verification-dependencies.sh"
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
      - name: Install release-cut proof dependencies
        if: ${{ !inputs.current-tooling }}
        working-directory: release-source/typescript
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            "$GITHUB_WORKSPACE/scripts/install-native-verification-dependencies.sh"
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Install Rust for version-only resolution and adapter acceptance
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore Rust dependencies for version-only resolution and adapter acceptance
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_INCREMENTAL: 0
        with:
          workspaces: release-source/rust
          shared-key: ${{ inputs.product == 'cli' && runner.os == 'macOS' && 'native-upgrade-adapter' || 'native-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.product == 'cli' && runner.os == 'macOS' }}
      - name: Inject the reviewed draft version for upgrade proof and #575 acceptance
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-assets-${{ inputs.tag }}
          path: ${{ runner.temp }}/upgrade
      - name: Prove last-published and declared-floor installation and bootstrap recovery
        env:
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          CURRENT_TOOLING: ${{ inputs.current-tooling }}
        run: |
          verification="$PWD/scripts/run-native-verification.sh"
          if [ "$CURRENT_TOOLING" = true ]; then verification="$GITHUB_WORKSPACE/scripts/run-native-verification.sh"; fi
          "$verification" "$TARGET" <<'VERIFY'
          started=$SECONDS
          # The log is kept so the conclusion can name the first error; pipefail keeps the exit status.
          set -o pipefail
          set --
          tooling=.
          skill=skills/tmux-team/SKILL.md
          if [ "$CURRENT_TOOLING" = true ]; then
            tooling="$GITHUB_WORKSPACE"
            set -- --source-root "$GITHUB_WORKSPACE/release-source"
            skill="$GITHUB_WORKSPACE/release-source/skills/tmux-team/SKILL.md"
          fi
          node "$tooling/typescript/scripts/release-upgrade.mjs" prove --product "$PRODUCT" --tag "$RELEASE_TAG" \
            --target "$TARGET" --directory "$RUNNER_TEMP/upgrade" --skill "$skill" "$@" \
            2>&1 | tee "$RUNNER_TEMP/upgrade-proof.log"
          # Handoff-capable candidate source requires its exact protocol-1 probe before either source runs.
          # Source/bootstrap durations and the separately injected adapter proof stay in this log.
          echo "Verified $TARGET in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          VERIFY
      - name: Prove the real-archive CLI upgrade adapter
        if: inputs.product == 'cli'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          CURRENT_TOOLING: ${{ inputs.current-tooling }}
        run: |
          verification="$PWD/scripts/run-native-verification.sh"
          if [ "$CURRENT_TOOLING" = true ]; then verification="$GITHUB_WORKSPACE/scripts/run-native-verification.sh"; fi
          "$verification" "$TARGET" <<'VERIFY'
          set -o pipefail
          set --
          tooling=.
          if [ "$CURRENT_TOOLING" = true ]; then
            tooling="$GITHUB_WORKSPACE"
            set -- --source-root "$GITHUB_WORKSPACE/release-source"
          fi
          node "$tooling/typescript/scripts/release-upgrade.mjs" acceptance --product cli --tag "$RELEASE_TAG" \
            --target "$TARGET" --directory "$RUNNER_TEMP/upgrade" "$@" \
            2>&1 | tee -a "$RUNNER_TEMP/upgrade-proof.log"
          VERIFY
      - name: Recheck version-only source after runtime proof and adapter acceptance
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
          phase: verify
      - name: Keep the log of a failed proof
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-proof-log-${{ matrix.target }}
          path: ${{ runner.temp }}/upgrade-proof.log
          if-no-files-found: ignore
          retention-days: 1

  # A release that cannot be proved must not look proved to whoever runs this by hand. The
  # publication run reads the outcome and the reason from the outputs, whatever this job says.

  conclude:
    name: Conclude the upgrade proof of ${{ inputs.tag }}
    needs: prove
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # A host's failure is named by the first error in its log; otherwise the reason the proof
      # could not run, which is empty when it ran and passed.
      reason: ${{ steps.failure.outputs.reason || inputs.fetch-reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      # The logs were written by the release commit's own scripts; this job runs this
      # repository's code and reads them as data, so what it outputs is one bounded line.
      - uses: actions/download-artifact@v4
        if: needs.prove.result == 'failure'
        continue-on-error: true
        with:
          pattern: upgrade-proof-log-*
          path: ${{ runner.temp }}/upgrade-logs
      - name: Name why the proof failed
        id: failure
        if: needs.prove.result == 'failure'
        run: node typescript/scripts/release-upgrade.mjs reason --directory "$RUNNER_TEMP/upgrade-logs"
      - name: Fail a release the proof cannot run for
        if: inputs.outcome == 'predates'
        env:
          REASON: ${{ inputs.fetch-reason }}
        run: |
          echo "$REASON" >&2
          exit 1
