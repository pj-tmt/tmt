name: Native release smoke

# Installs a published alpha release the way a user does, on the four hosts of the upgrade proof, in
# an isolated home, state directory and prefix: the public installer and `tmt upgrade` for a CLI
# release, the newest published CLI's `tmt extension install <extension>` for an extension release.
# It only reads the public release and never publishes, creates or changes anything. The publication
# run calls it after its own checks of the published release, and a maintainer can run it by hand
# for the newest published release of a product: it installs what the public entry points serve
# now, so an older tag fails its first check. A failure opens, or comments on, the issue of those
# checks; an immutable release is never rolled back.
on:
  workflow_call:
    inputs:
      product:
        description: Native product of the published release
        required: true
        type: string
      tag:
        description: Published release to install
        required: true
        type: string
    outputs:
      outcome:
        description: Classified smoke failure; empty when the install passed
        value: ${{ jobs.report.outputs.outcome }}
  workflow_dispatch:
    inputs:
      product:
        description: Native product of the published release
        required: true
        type: choice
        options:
          - cli
          - office
          - squad
      tag:
        description: Published release to install
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Install ${{ inputs.tag }} from the public release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # This repository's code runs here; the tag is checked out only so that its skills can be
      # read as data, and nothing of it is executed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install from the public release
        env:
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          node typescript/scripts/verify-public-install.mjs --product "$PRODUCT" --tag "$RELEASE_TAG" \
            --source release-source --target "$TARGET" --result-file "$RUNNER_TEMP/smoke-result.json"
      - name: Keep the host conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures-${{ inputs.product }}-${{ inputs.tag }}-${{ matrix.target }}
          overwrite: true
          path: ${{ runner.temp }}/smoke-result.json
          if-no-files-found: ignore
          retention-days: 1

  # The legs hold no write access: they run the public installer and the installed release. This
  # job only turns what they kept, as data, into the issue.
  report:
    name: Report a failed install of ${{ inputs.tag }}
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: smoke-failures-${{ inputs.product }}-${{ inputs.tag }}-*
          path: ${{ runner.temp }}/smoke-failures
      - name: Open or update the issue
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node typescript/scripts/release-publish.mjs report --product "$PRODUCT" --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/smoke-failures" --expected-results 4 \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

  # Fast scheduling only: the reset wait and anonymous re-proof run outside release-<product>.
  retry-dispatch:
    name: Schedule a classified public install retry
    needs: report
    if: ${{ !cancelled() && needs.report.outputs.outcome == 'infrastructure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-failures-${{ inputs.product }}-${{ inputs.tag }}-*
          path: ${{ runner.temp }}/smoke-failures
      - name: Dispatch only eligible affected targets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node typescript/scripts/public-install-retry.mjs dispatch --directory "$RUNNER_TEMP/smoke-failures"
