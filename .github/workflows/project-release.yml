name: Project release tracking

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Native release artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to replay
        required: true
        type: string
      dry_run:
        description: Read and report without changing Project 4
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Pending runs can be replaced. Every automatic run reconciles the last ten
# published releases rather than relying on just one event surviving the queue.
concurrency:
  group: project-4-release-tracking
  cancel-in-progress: false

jobs:
  update:
    name: Record released project issues
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Execute trusted default-branch tooling, never a release tag or run artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Reconcile published releases into Project 4
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node typescript/scripts/project-release.mjs
