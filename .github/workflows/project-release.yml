name: Project release tracking

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and report without changing the release project
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Pending dispatches can be replaced: every run sweeps all existing closed issues.
# Daily recovery also covers missed dispatches and manual publications.
concurrency:
  group: project-release-tracking
  cancel-in-progress: false

jobs:
  update:
    name: Record released project issues
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require release App credentials
        env:
          HAS_APP_CREDENTIALS: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_CREDENTIALS" != true ]; then
            echo 'Release App credentials are missing: configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY in the release environment.' >&2
            exit 1
          fi
      - name: Create the project updater App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: pj-tmt
          repositories: tmt
          permission-organization-projects: write
          permission-pull-requests: read
          permission-issues: read
      # Execute trusted default-branch tooling, never a release tag or run artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install the pinned metadata toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore dependency cache for locked source acquisition
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Reconcile published releases into the release project
        env:
          RELEASE_APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node typescript/scripts/project-release.mjs
