name: Native release prepare

# Build, assemble and final verification of one product's native bundle for an exact source
# commit: the four target archives, the cargo-dist manifest, notices, bootstrap and the
# matching-host verifiers (including x64 Node under Rosetta). Called by `native-release-bundle.yml`
# for a draft release and by `release-rehearsal.yml` and `ci.yml` before merge, so a release never
# runs a packaging check for the first time. It has no secrets, Environment or write permission on
# the repository and publishes nothing. Cache behavior: the Rust dependency cache is saved by main
# only; the packaging-tools cache is saved on a miss in any run, including a pull request's own
# scope, and holds only developer tools keyed by exact versions.
on:
  workflow_call:
    inputs:
      product:
        description: Native product to build
        required: true
        type: string
      tag:
        description: Draft release the bundle is for; empty prepares a bundle for the source commit without a release
        required: false
        default: ''
        type: string
      sha:
        description: Source commit to package; empty builds the caller's commit
        required: false
        default: ''
        type: string
      upgrade:
        description: Also prove the upgrade from the last published release with this run's verified bundle (rehearsals only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.product }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: &native-targets
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/release-source/rust/target
    defaults:
      run:
        working-directory: release-source
    steps:
      # Reviewed main tooling owns injection; source and ordinary archive proof stay at cut X.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
          path: release-source
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
        with:
          architecture: ${{ inputs.product == 'cli' && matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Install embedded Office build dependencies
        if: inputs.product == 'office'
        working-directory: release-source/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install native build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --target '${{ matrix.target }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: release-source/rust
          # Per product: each product compiles a different set of dependencies, and a cache
          # that another product saved first would stay incomplete. Only main writes it.
          shared-key: release-${{ inputs.product }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Inject the reviewed draft version and verify its source/lock contract
        id: version
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
      - name: Cache packaging tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
      - name: Build pinned packaging tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo +1.97.0 install cargo-dist --version 0.32.0 --locked --root "$HOME/.tmt-packaging"
          cargo +1.97.0 install cargo-about --version 0.9.2 --features cli --locked --root "$HOME/.tmt-packaging"
      - name: Build release archive and target manifest
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euo pipefail
          export PATH="$HOME/.tmt-packaging/bin:$PATH"
          started=$SECONDS
          cargo +1.97.0 fetch --manifest-path rust/Cargo.toml --locked
          TMT_NATIVE_REAL_CARGO=$(command -v cargo)
          export TMT_NATIVE_REAL_CARGO CARGO="$PWD/scripts/native-cargo.sh"
          dist plan --tag "$RELEASE_TAG" --target "$TARGET" --output-format=json --no-local-paths > "$RUNNER_TEMP/plan.json"
          scripts/build-native-artifact.sh "$TARGET" "$PRODUCT" > "$RUNNER_TEMP/$TARGET-dist-manifest.json"
          cp "$RUNNER_TEMP/$TARGET-dist-manifest.json" target/distrib/
          cp rust/target/native-notices/THIRD-PARTY-NOTICES.txt "target/distrib/$TARGET-notices.txt"
          echo "Built the $PRODUCT archive for $TARGET in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify plan, archive and binary versions against the injected tag
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/injected-archive"
          tar -xzf "target/distrib/tmt-$PRODUCT-$TARGET.tar.gz" -C "$RUNNER_TEMP/injected-archive"
          binary="tmt-$PRODUCT"
          if [ "$PRODUCT" = cli ]; then binary=tmt; fi
          node "$GITHUB_WORKSPACE/typescript/scripts/release-version-injection.mjs" artifact "$PWD" "$RUNNER_TEMP/release-version-state.json" \
            "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/$TARGET-dist-manifest.json" "$RUNNER_TEMP/injected-archive/tmt-$PRODUCT-$TARGET/$binary"
      - name: Capture compiled CLI schema from the verified target archive
        if: inputs.product == 'cli'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/run-native-verification.sh "$TARGET" <<'SCHEMA'
          node "$GITHUB_WORKSPACE/typescript/scripts/native-application-schema.mjs" capture \
            "$PWD" "$RUNNER_TEMP/release-version-state.json" "$TARGET" \
            "$RUNNER_TEMP/injected-archive/tmt-cli-$TARGET/tmt" "target/distrib/tmt-cli-$TARGET.tar.gz" \
            "target/distrib/$TARGET-application-schema.json"
          SCHEMA
      - name: Recheck version-only source after this stage
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
          phase: verify
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.product }}-${{ matrix.target }}-${{ inputs.tag || 'main' }}
          path: |
            release-source/target/distrib/*.tar.gz
            release-source/target/distrib/*.sha256
            release-source/target/distrib/*-dist-manifest.json
            release-source/target/distrib/*-notices.txt
            release-source/target/distrib/*-application-schema.json
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble authoritative ${{ inputs.product }} release manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/release-source/rust/target
    defaults:
      run:
        working-directory: release-source
    steps:
      # Reviewed main tooling owns injection; source and ordinary archive proof stay at cut X.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
          path: release-source
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Inject the reviewed draft version and verify its source/lock contract
        id: version
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
      - name: Restore required packaging tools
        id: tools-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
          fail-on-cache-miss: true
      - name: Retry required packaging tools restore once
        id: tools-retry
        if: steps.tools-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.tmt-packaging
          key: native-tools-${{ runner.os }}-${{ runner.arch }}-rust1.97-dist0.32.0-about0.9.2
          fail-on-cache-miss: true
      - name: Require an exact packaging tools cache hit
        env:
          CACHE_HIT: ${{ steps.tools-restore.outputs.cache-hit == 'true' || steps.tools-retry.outputs.cache-hit == 'true' }}
        run: |
          if [ "$CACHE_HIT" != true ]; then
            echo "Required packaging tools cache was not restored after two attempts." >&2
            exit 1
          fi
      - name: Install verification dependencies
        working-directory: release-source/typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: native-${{ inputs.product }}-*-${{ inputs.tag || 'main' }}
          merge-multiple: true
          path: release-source/target/distrib
      - name: Merge with cargo-dist and verify bootstrap inputs
        env:
          PRODUCT: ${{ inputs.product }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.tmt-packaging/bin:$PATH"
          export RUSTUP_TOOLCHAIN=1.97.0
          TMT_NATIVE_REAL_CARGO=$(command -v cargo)
          export TMT_NATIVE_REAL_CARGO
          export CARGO="$PWD/scripts/native-cargo.sh"
          package="tmt-$PRODUCT"
          export PACKAGE="$package"
          version=$(cargo metadata --manifest-path rust/Cargo.toml --locked --no-deps --format-version 1 | node -pe 'const p=process.env.PACKAGE; JSON.parse(require("fs").readFileSync(0,"utf8")).packages.find(x => x.name === p).version')
          tag="v$version"
          if [ "$PRODUCT" != cli ]; then tag="tmt-$PRODUCT-v$version"; fi
          # The draft tag must agree with the injected source version.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$tag" ]; then
            echo "Draft release $RELEASE_TAG is not the $tag that the injected checkout declares." >&2
            exit 1
          fi
          dist plan --tag "$tag" --output-format=json --no-local-paths > "$RUNNER_TEMP/plan.json"
          dist build --tag "$tag" --artifacts global --output-format=json --no-local-paths > "$RUNNER_TEMP/dist-manifest.json"
          node "$GITHUB_WORKSPACE/typescript/scripts/release-version-injection.mjs" manifests "$PWD" "$RUNNER_TEMP/release-version-state.json" \
            "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/dist-manifest.json"
          cp "$RUNNER_TEMP/dist-manifest.json" target/distrib/dist-manifest.json
          if [ "$PRODUCT" = cli ]; then
            node "$GITHUB_WORKSPACE/typescript/scripts/native-application-schema.mjs" assemble \
              "$PWD" "$RUNNER_TEMP/release-version-state.json" target/distrib
          fi
          # How this product's GitHub release must be published (#333): only the
          # CLI becomes the repository's latest release.
          node typescript/scripts/release-policy.mjs --product "$PRODUCT" > target/distrib/release-publication.json
          if [ "$PRODUCT" = cli ]; then
            node typescript/scripts/generate-native-bootstrap.mjs --manifest target/distrib/dist-manifest.json --archive-dir target/distrib --plan "$RUNNER_TEMP/plan.json" > target/distrib/tmt-installer.sh
            sh -n target/distrib/tmt-installer.sh
            shellcheck --shell sh target/distrib/tmt-installer.sh
            # The same verified bootstrap under the name the one-line install uses.
            cp target/distrib/tmt-installer.sh target/distrib/install.sh
          fi
      - name: Recheck version-only source after this stage
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
          phase: verify
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag || 'main' }}
          path: |
            release-source/target/distrib/*.tar.gz
            release-source/target/distrib/*.sha256
            release-source/target/distrib/sha256.sum
            release-source/target/distrib/dist-manifest.json
            release-source/target/distrib/release-publication.json
            release-source/target/distrib/tmt-installer.sh
            release-source/target/distrib/install.sh
            release-source/target/distrib/*-notices.txt
            release-source/target/distrib/*-application-schema.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify final ${{ inputs.product }} bundle (${{ matrix.target }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix: *native-targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/release-source/rust/target
    defaults:
      run:
        working-directory: release-source
    steps:
      # Reviewed main tooling owns injection; source and ordinary archive proof stay at cut X.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}
          path: release-source
      - name: Require candidate Rosetta tooling
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          if [ ! -x scripts/run-native-verification.sh ]; then
            echo '::error::candidate predates #547 Rosetta tooling; the owner reruns with native-release rerun=<tag>'
            exit 1
          fi
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-tooling
        with:
          architecture: ${{ matrix.target == 'x86_64-apple-darwin' && 'x64' || '' }}
      - name: Install verification dependencies
        working-directory: release-source/typescript
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            "$GITHUB_WORKSPACE/scripts/install-native-verification-dependencies.sh"
          else
            pnpm install --frozen-lockfile --ignore-scripts
          fi
      - name: Install trusted CLI verification dependencies
        if: inputs.product == 'cli'
        working-directory: typescript
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            "$GITHUB_WORKSPACE/scripts/install-native-verification-dependencies.sh" --trusted-cli
          else
            pnpm --filter tmt --fail-if-no-match install --frozen-lockfile --ignore-scripts
          fi
      - name: Install pinned Rust for version-only resolution
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Inject the reviewed draft version and verify its source/lock contract
        id: version
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
      - uses: actions/download-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag || 'main' }}
          path: release-source/target/distrib
      - name: Warm the macOS toolchain lookup
        if: runner.os == 'macOS'
        uses: ./.github/actions/warm-xcrun
      - name: Build independent expected Colab app bytes
        if: inputs.product == 'colab'
        working-directory: release-source/typescript
        run: |
          corepack pnpm@10.33.0 --filter @tmt/colab-app --fail-if-no-match install --frozen-lockfile --ignore-scripts
          corepack pnpm@10.33.0 --filter @tmt/colab-app --fail-if-no-match build
          mv ../extensions/tmt-colab/typescript/app/dist "$RUNNER_TEMP/colab-app"
      - name: Execute final archive and bootstrap with the matching target process
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ matrix.target }}
        run: |
          scripts/run-native-verification.sh "$TARGET" <<'VERIFY'
          started=$SECONDS
          node typescript/scripts/release-policy.mjs --product "$PRODUCT" | cmp - target/distrib/release-publication.json
          if [ "$PRODUCT" = cli ]; then
            node "$GITHUB_WORKSPACE/typescript/scripts/verify-native-artifact.mjs" \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-cli-$TARGET.tar.gz" --target "$TARGET" \
              --skill skills/tmt/SKILL.md --license LICENSE \
              --notices "target/distrib/$TARGET-notices.txt" --source-root "$PWD" \
              --schema-snapshot "$RUNNER_TEMP/release-version-state.json" \
              --schema-evidence "target/distrib/$TARGET-application-schema.json"
            node typescript/scripts/verify-native-bootstrap.mjs \
              --manifest target/distrib/dist-manifest.json \
              --archive "target/distrib/tmt-cli-$TARGET.tar.gz" --target "$TARGET" \
              --skill skills/tmt/SKILL.md
            node typescript/scripts/generate-native-bootstrap.mjs --manifest target/distrib/dist-manifest.json --archive-dir target/distrib > "$RUNNER_TEMP/installer.sh"
            cmp "$RUNNER_TEMP/installer.sh" target/distrib/tmt-installer.sh
            cmp target/distrib/tmt-installer.sh target/distrib/install.sh
          else
            verification_args=(
              --product "$PRODUCT"
              --manifest target/distrib/dist-manifest.json
              --archive "target/distrib/tmt-$PRODUCT-$TARGET.tar.gz" --target "$TARGET"
              --license LICENSE --notices "target/distrib/$TARGET-notices.txt"
            )
            ships_skills=$(node --input-type=module --eval '
              import { shipsSkills } from "./typescript/scripts/component-skills.mjs";
              process.stdout.write(String(shipsSkills(process.argv[1])));
            ' "$PRODUCT")
            if [ "$ships_skills" = true ]; then
              verification_args+=(--skills "extensions/tmt-$PRODUCT/skills")
            fi
            if [ "$PRODUCT" = colab ]; then
              verification_args+=(--app-dir "$RUNNER_TEMP/colab-app")
            fi
            node typescript/scripts/verify-native-artifact.mjs "${verification_args[@]}"
          fi
          echo "Verified $TARGET in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
          VERIFY

      - name: Recheck version-only source after this stage
        uses: ./.github/actions/inject-release-version
        with:
          product: ${{ inputs.product }}
          tag: ${{ inputs.tag }}
          source-root: release-source
          phase: verify

  # The rehearsal's upgrade proof. Candidate files come from this run's verified bundle, never a
  # GitHub release, so this fetch is read-only and cannot see or touch draft state; the write-token
  # fetch of `native-release-upgrade.yml` is not called from here.
  upgrade-fetch:
    name: Stage the ${{ inputs.product }} candidate for the upgrade proof
    needs: [assemble, verify]
    if: inputs.upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.assess.outputs.outcome }}
      reason: ${{ steps.assess.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@v4
        with:
          name: native-release-${{ inputs.product }}-bundle-${{ inputs.tag || 'main' }}
          path: ${{ runner.temp }}/candidate
      - name: Stage the candidate with the published releases it upgrades from
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          CANDIDATE_TAG: ${{ needs.assemble.outputs.tag }}
        run: |
          node typescript/scripts/release-upgrade.mjs fetch --product "$PRODUCT" --tag "$CANDIDATE_TAG" \
            --directory "$RUNNER_TEMP/upgrade-assets" --candidate-directory "$RUNNER_TEMP/candidate"
      - name: Assess whether the proof can run at that commit
        id: assess
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
        run: |
          node typescript/scripts/release-upgrade.mjs assess --directory "$RUNNER_TEMP/upgrade-assets" --sha "$RELEASE_SHA"
      - name: Hand the assets to the proof
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-assets-${{ needs.assemble.outputs.tag }}
          path: ${{ runner.temp }}/upgrade-assets
          if-no-files-found: error
          retention-days: 1

  upgrade:
    name: Upgrade proof of the ${{ inputs.product }} candidate
    needs: [assemble, upgrade-fetch]
    if: ${{ !cancelled() && needs.upgrade-fetch.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-release-upgrade-prove.yml
    with:
      product: ${{ inputs.product }}
      tag: ${{ needs.assemble.outputs.tag }}
      sha: ${{ inputs.sha || github.sha }}
      outcome: ${{ needs.upgrade-fetch.outputs.outcome }}
      fetch-reason: ${{ needs.upgrade-fetch.outputs.reason }}

  # The rehearsal's dry run of the publication gates that need no draft (channel, immutability,
  # monotonic, migration; commit only on main): the candidate's synthetic alpha tag and source
  # commit go through the same checks `native-release-bundle.yml` runs on a draft. It reads
  # published releases and git history, records no hold and publishes nothing.
  gates-dry:
    name: Publication gates (dry) for the ${{ inputs.product }} candidate
    needs: assemble
    if: inputs.upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tooling
      - name: Install reviewed publication-gate dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned metadata toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Restore dependency cache for locked source acquisition
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: native-rust
          save-if: false
      - name: Evaluate the gates for the candidate without a draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          CANDIDATE_TAG: ${{ needs.assemble.outputs.tag }}
          CANDIDATE_SHA: ${{ inputs.sha || github.sha }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          args=(--product "$PRODUCT" --tag "$CANDIDATE_TAG" --sha "$CANDIDATE_SHA")
          if [ "$ON_MAIN" = true ]; then args+=(--on-main); fi
          node typescript/scripts/publication-gates.mjs dry "${args[@]}"
