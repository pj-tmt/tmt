name: Install pinned nextest
description: Install the reviewed Linux x64 archive with an exact digest; no Cargo build.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/nextest-tool"
        curl --fail --location --max-time 90 https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/nextest-tool/tool.tar.gz"
        printf '%s  %s\n' 223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc "$RUNNER_TEMP/nextest-tool/tool.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/nextest-tool/tool.tar.gz" -C "$RUNNER_TEMP/nextest-tool"
        "$RUNNER_TEMP/nextest-tool/cargo-nextest" nextest --version
        printf '%s\n' "$RUNNER_TEMP/nextest-tool" >> "$GITHUB_PATH"
