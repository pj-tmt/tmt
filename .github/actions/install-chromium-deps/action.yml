name: Install Chromium system dependencies
description: >-
  Installs the pinned Playwright Ubuntu 24.04 Chromium and tools dependencies
  through the shared bounded apt action. Browser binaries remain caller-owned.
runs:
  using: composite
  steps:
    # Playwright 1.63.0 ubuntu24.04-x64 tools + Chromium, shared by Chromium CI consumers.
    # Refresh this list and its pinning test together when the Playwright pin changes.
    - uses: ./.github/actions/apt-install
      with:
        packages: >-
          xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic
          xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
          fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64
          libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
          libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
          libxkbcommon0 libxrandr2
