name: Set up Node.js and pnpm
description: >-
  Node.js at the version this repository pins, and pnpm activated through
  Corepack. Registry acquisition uses a bounded retry. Dependency installation
  stays in the calling job because its filters differ.
inputs:
  node-version:
    description: Node.js version.
    default: 26.12.1
  pnpm-version:
    description: pnpm version activated through Corepack.
    default: 10.33.0
  architecture:
    description: Node.js architecture; empty uses the runner architecture.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.architecture }}
    - name: Activate pinned pnpm
      shell: bash
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        corepack_dir=$(mktemp -d)
        trap 'rm -rf "$corepack_dir"' EXIT
        "$GITHUB_WORKSPACE/scripts/retry-command.sh" 3 5 npm pack corepack@0.36.0 --pack-destination "$corepack_dir" --silent
        node -e 'const fs = require("node:fs"), crypto = require("node:crypto"); require("node:assert/strict").equal(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"), "SiiJsBhZqdBiPHTEl6OT3sASrRrKIcYTQMsVGXx6EE/gM8WFMwYjeIX8Tt8RiU4Iv2J6LbT8KpGfCOsBpRWB/w==", "Corepack tarball integrity");' "$corepack_dir/corepack-0.36.0.tgz"
        npm install --global --ignore-scripts "$corepack_dir/corepack-0.36.0.tgz"
        corepack enable
        "$GITHUB_WORKSPACE/scripts/retry-command.sh" 3 5 corepack prepare "pnpm@$PNPM_VERSION" --activate
