name: Set up Node.js and pnpm
description: >-
  Node.js at the version this repository pins, and pnpm activated through
  Corepack. Corepack downloads pnpm from the npm registry, and that download has
  failed inside the Node 22.23.2 bundled HTTP client without any change to the
  repository, so it runs under a bounded retry. Dependency installation stays in
  the calling job because its filters differ.
inputs:
  node-version:
    description: Node.js version.
    default: 22.23.2
  pnpm-version:
    description: pnpm version activated through Corepack.
    default: 10.33.0
  architecture:
    description: Node.js architecture; empty uses the runner architecture.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        architecture: ${{ inputs.architecture }}
    - name: Activate pinned pnpm
      shell: bash
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        corepack enable
        "$GITHUB_WORKSPACE/scripts/retry-command.sh" 3 5 corepack prepare "pnpm@$PNPM_VERSION" --activate
