name: Prove an anonymous public install
description: Shared host entry for the source smoke and its single deferred retry.
inputs:
  product:
    description: Native product of the published release.
    required: true
  tag:
    description: Published release to install.
    required: true
  target:
    description: Matching target of this host.
    required: true
  retry:
    description: Use one acquisition attempt without a further rate-limit retry.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # The release checkout is data; only the caller's trusted tooling executes.
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ inputs.tag }}
        path: release-source
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.2
    - name: Set up driver archive verification tooling
      if: inputs.product == 'driver-herdr'
      uses: ./.github/actions/setup-tooling
    - name: Install driver archive verification dependencies
      if: inputs.product == 'driver-herdr'
      shell: bash
      working-directory: typescript
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Install from the public release
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
        RELEASE_TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.target }}
        RETRY: ${{ inputs.retry }}
      run: |
        retry_args=()
        case "$RETRY" in
          true) retry_args=(--retry) ;;
          false) ;;
          *) echo 'retry must be true or false' >&2; exit 1 ;;
        esac
        node typescript/scripts/verify-public-install.mjs --product "$PRODUCT" --tag "$RELEASE_TAG" \
          --source release-source --target "$TARGET" "${retry_args[@]}" \
          --result-file "$RUNNER_TEMP/smoke-result.json"
