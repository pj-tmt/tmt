[package]
name = "tmt-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Plain reply-notice columns share the pinned terminal-width implementation.
unicode-width.workspace = true
time.workspace = true
tungstenite.workspace = true
serde.workspace = true
ureq.workspace = true
tmt-core.workspace = true
tmt-driver-protocol.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
semver.workspace = true
toml_edit.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
subprocess.workspace = true
nix = { workspace = true, features = ["feature", "term", "socket"] }
signal-hook.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tmt-sys.workspace = true

[dev-dependencies]
tmt-test-support.workspace = true
# Only the legacy prop-pack migration test decodes Office packs.
tmt-office-model.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustls.workspace = true
rcgen.workspace = true
nix = { workspace = true, features = ["term", "net"] }

[lints]
workspace = true

[[example]]
name = "claude-hook-fixture"
test = true
