[package]
name = "tmt-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
office = ["dep:url", "dep:getrandom", "dep:keyring-core", "dep:zbus-secret-service-keyring-store", "dep:apple-native-keyring-store"]

[dependencies]
getrandom = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
serde.workspace = true
url = { workspace = true, optional = true }
ureq.workspace = true
tmt-core.workspace = true
tmt-office-model.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
semver.workspace = true
tar.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dependencies]
subprocess.workspace = true
nix.workspace = true
signal-hook.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[dev-dependencies]
png.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustls.workspace = true
rcgen.workspace = true
nix = { workspace = true, features = ["term"] }

[lints]
workspace = true
