[package]
name = "tmt-driver-herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Not shipped yet: the driver replaces the built-in Herdr host in a later
# #479 step, and packaging it is its own decision.
[package.metadata.dist]
dist = false

# The Herdr host driver (#479, #570): an out-of-process driver built on the
# protocol crate alone, with tmt-invoke as its bounded process owner. It holds
# no TMT behavior; core keeps every decision (contracts/driver-protocol-v1.md).
[dependencies]
semver.workspace = true
serde_json.workspace = true
tmt-driver-protocol.workspace = true
tmt-invoke.workspace = true

[[bin]]
name = "tmt-driver-herdr"
path = "src/main.rs"

[lints]
workspace = true
