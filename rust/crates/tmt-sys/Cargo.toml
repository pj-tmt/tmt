[package]
name = "tmt-sys"
build = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# The sole audited unsafe boundary. Keep unsafe denied except at the one
# reviewed function; every other workspace crate inherits unsafe_code=forbid.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
