[package]
name = "tmt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true
# Package include replaces the workspace list in pinned cargo-dist 0.32.0.
# Retain its common files plus the driver package's binary until #1084.
include = [
  "../../../LICENSE",
  "../../archive/NATIVE-INSTALL.md",
  "../../target/native-notices/THIRD-PARTY-NOTICES.txt",
  "../../target/native-companion/tmt-driver-herdr",
]

[[bin]]
name = "tmt"
path = "src/main.rs"

[dependencies]
tmt-core.workspace = true
tmt-adapters.workspace = true
tmt-command-output.workspace = true
tmt-cli-style.workspace = true
tmt-office-command.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true

[dev-dependencies]
tmt-test-support.workspace = true
toml_edit.workspace = true
crossterm.workspace = true
insta.workspace = true
tmt-office-model.workspace = true
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
# Macro arguments are token streams; the output guard scans them.
proc-macro2 = { version = "=1.0.107", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
