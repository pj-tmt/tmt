[workspace]
members = ["crates/tmt-core", "crates/tmt-adapters", "crates/tmt-cli-style", "crates/tmt-invoke", "crates/tmt-command-output", "crates/tmt-driver-protocol", "crates/tmt-host-grammar", "crates/tmt-cli", "../extensions/tmt-office/rust/tmt-office", "../extensions/tmt-office/rust/tmt-office-model", "../extensions/tmt-office/rust/tmt-office-command", "../extensions/tmt-office/rust/tmt-office-storage", "../extensions/tmt-office/rust/tmt-office-pairing", "../extensions/tmt-office/rust/tmt-office-service", "../extensions/tmt-squad/rust/tmt-squad", "../extensions/tmt-remote/rust/tmt-remote"]
resolver = "3"

[workspace.package]
version = "5.0.0-alpha.11"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/wkh237/tmt"

[workspace.dependencies]
getrandom = "=0.4.3"
keyring-core = "=1.0.0"
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
serde = { version = "=1.0.229", features = ["derive"] }
url = "=2.5.8"
unicode-width = { version = "=0.2.2", default-features = false }
anstream = "=1.0.0"
anstyle = "=1.0.14"
comfy-table = "=8.0.1"
crossterm = { version = "=0.29.0", default-features = false }
shlex = "=2.0.1"
insta = { version = "=1.48.0", default-features = false }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls", "platform-verifier"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
semver = "=1.0.28"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tmt-core = { path = "crates/tmt-core" }
tmt-host-grammar = { path = "crates/tmt-host-grammar" }
tmt-office-model = { path = "../extensions/tmt-office/rust/tmt-office-model" }
tmt-adapters = { path = "crates/tmt-adapters" }
tmt-command-output = { path = "crates/tmt-command-output" }
tmt-driver-protocol = { path = "crates/tmt-driver-protocol" }
tmt-cli-style = { path = "crates/tmt-cli-style" }
tmt-invoke = { path = "crates/tmt-invoke" }
tmt-office-command = { path = "../extensions/tmt-office/rust/tmt-office-command" }
tmt-office-storage = { path = "../extensions/tmt-office/rust/tmt-office-storage" }
tmt-office-pairing = { path = "../extensions/tmt-office/rust/tmt-office-pairing" }
tmt-office-service = { path = "../extensions/tmt-office/rust/tmt-office-service" }
clap = { version = "=4.6.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "string"] }
clap_complete = { version = "=4.6.9", default-features = false }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
subprocess = "=1.2.1"
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process", "fs", "poll", "user"] }
uuid = { version = "=1.26.0", default-features = false, features = ["std"] }
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "=2.3.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
ed25519-dalek = "=3.0.0"
hmac = "=0.13.0"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
png = "=0.18.1"
signal-hook = { version = "=0.4.4", default-features = false }
httparse = "=1.10.1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dist]
inherits = "release"
