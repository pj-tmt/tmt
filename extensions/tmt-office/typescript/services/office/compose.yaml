name: tmt-office
services:
  emulators:
    build:
      context: ../../../../..
      dockerfile: extensions/tmt-office/typescript/services/office/Dockerfile
    init: true
    ports:
      - '127.0.0.1:9099:9099'
      - '127.0.0.1:8080:8080'
    # Intentionally no host credentials, configuration or data volumes.
    stop_grace_period: 20s
