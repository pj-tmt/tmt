[package]
workspace = "../../../../rust"
name = "tmt-office"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true
features = ["local-service"]

[features]
local-service = ["dep:httparse", "dep:getrandom", "dep:base64", "dep:serde", "dep:uuid"]

[dependencies]
tmt-core.workspace = true
tmt-office-model.workspace = true
tmt-adapters.workspace = true
tmt-office-pairing.workspace = true
tmt-office-command.workspace = true
tmt-office-storage.workspace = true
httparse = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
uuid = { workspace = true, optional = true, features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tmt-office-storage = { workspace = true, features = ["in-process-core"] }
png.workspace = true
rusqlite.workspace = true
