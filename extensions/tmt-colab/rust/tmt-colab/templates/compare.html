<!-- layout: column. Colab sets the column width and the gaps: never set max-width or margin on a block. See tmt colab skill layout, section The frame -->
<!-- style: the base look, from tmt colab skill page-style. Keep it, and change colours and type there, never the frame. See tmt colab skill page-style -->
{{style}}
<!-- component: summary. What is compared and what the reader should conclude. See tmt colab skill components, section Summary -->
<section class="tmt-ui-card">
  <h2 class="tmt-ui-card-title">Summary</h2>
  <p>Say what is compared and which side you recommend.</p>
</section>
<!-- style: the layout inside a block is yours, but the block's own width and gap are not. See tmt colab skill layout, section What CSS may change -->
<style>
  .compare { display: flex; flex-wrap: wrap; }
  .compare > div { flex: 1 1 280px; padding-right: 16px; }
</style>
<!-- component: compare. Two sides that stack on a narrow window; the flex layout is inside the block. See tmt colab skill components, section Compare -->
<section class="tmt-ui-card compare">
  <div>
    <h3>Now</h3>
    <p>Today's behaviour.</p>
  </div>
  <div>
    <h3>After</h3>
    <p>The proposed behaviour.</p>
  </div>
</section>
<!-- component: section and question. The decision the comparison leads to, asked as a question the reader answers, never in prose. See tmt colab skill components, sections Section and Questions. Rules for questions: tmt colab skill questions -->
<section class="tmt-ui-card">
  <h2 class="tmt-ui-card-title">Recommendation</h2>
  <p><span class="waiting">◆</span> Waiting for the reader's decision</p>
  <div>
    <tmt-question data-id="{{uuid:decision}}" data-kind="single" data-agent="Your agent name">
      <p data-question>Which side do you choose?</p>
      <span data-choice>Now</span><span data-choice>After</span>
    </tmt-question>
  </div>
</section>
