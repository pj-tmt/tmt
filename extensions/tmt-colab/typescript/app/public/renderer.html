<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Colab page renderer</title>
  </head>
  <body>
    <script>
      // This build-owned bootstrap runs under the renderer response CSP, never
      // the parent app policy. Direct opening is opaque too (CSP sandbox).
      (() => {
        const bind = (event) => {
          if (window.parent === window || event.source !== window.parent) return;
          const value = event.data;
          if (!value || typeof value !== 'object' || Array.isArray(value)) return;
          if (
            Object.keys(value).length !== 4 ||
            value.type !== 'colab.render.bind' ||
            typeof value.renderId !== 'string' ||
            typeof value.sourceDigest !== 'string' ||
            !/^[0-9a-f]{64}$/.test(value.sourceDigest) ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:[0-9a-f]{64}$/.test(
              value.renderId,
            ) ||
            !value.renderId.endsWith(':' + value.sourceDigest) ||
            typeof value.source !== 'string' ||
            new TextEncoder().encode(value.source).byteLength > 2 * 1024 * 1024 ||
            event.ports.length !== 1
          )
            return;
          window.removeEventListener('message', bind);
          // No effectful commands exist on this port. Page scripts may forge the
          // acknowledgement; it grants no app authority or selection truth.
          event.ports[0].onmessage = () => {};
          const acknowledgement = `<script>addEventListener('load',()=>parent.postMessage({type:'colab.render.bound',renderId:${JSON.stringify(value.renderId)}},'*'),{once:true})<\/script>`;
          // document.open/write retains this document's response policy. The
          // trusted acknowledgement precedes author HTML; scripts run normally.
          document.open();
          document.write(
            `<!doctype html><html><head>${acknowledgement}</head><body>${value.source}</body></html>`,
          );
          document.close();
        };
        window.addEventListener('message', bind);
      })();
    </script>
  </body>
</html>
