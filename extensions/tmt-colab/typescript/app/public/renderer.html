<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Colab page renderer</title>
  </head>
  <body>
    <script>
      // Cosmetic quote capture/resolution only. Author code may tamper with this

      (() => {
        function install(renderId, port, theme) {

          const excluded = 'head,script,style,template,noscript,[hidden],[data-colab-highlight]';

            v &&
            typeof v === 'object' &&
            !Array.isArray(v) &&
            Object.keys(v).length === 3 &&
            typeof v.exact === 'string' &&
            v.exact.length > 0 &&
            utf8.encode(v.exact).length <= 16 * 1024 &&

            requestId = '',

            timer;
          let questionBlocks = [],
            questionThreads = [],
            questionRequestId = '';
          let slots = [],
            slotRequestId = '';

            height = 0,
            innerScroll = false;

            schedule();
            capture();

              event.defaultPrevented ||
              event.button !== 0 ||
              event.metaKey ||
              event.ctrlKey ||

                    spans.push({ node, start: offset, end });

                  white = true;

                  points.push(point);
                  spans.push({ node, start: offset, end });
                  units.push(unit);
                  unit += point.length;

            completedSelection = false,
            hover,
            hint,
            hintTimer,
            hoverFrame,
            hoverPointer;

            hoverPointer = undefined;

            target instanceof Element &&
            !target.closest('[data-colab-highlight]') &&

            target !== document.documentElement

              rectangles = 0;

            hover.dataset.colabSelectionOutline = '';

            if (
              !event.isTrusted ||
              event.defaultPrevented ||
              event.button !== 0 ||
              event.altKey ||
              event.ctrlKey ||
              event.metaKey ||
              event.shiftKey

              return;

              editingTarget(event.target) ||
              !getSelection()?.isCollapsed ||
              gesture?.moved ||
              (gesture && performance.now() - gesture.startedAt >= 500)

              event.preventDefault();
              event.stopImmediatePropagation();

                type: 'colab.render.open-thread',
                renderId,
                requestId,
                id: hit.id,
              });
              return;
            }
            if (!selecting) return;
            const target = targetAt(event.target);
            if (!target) return;
            event.preventDefault();
            event.stopImmediatePropagation();

              getSelection()?.addRange(range);

            if (quote) parent.postMessage({ type: 'colab.render.annotate', renderId }, '*');

              clearTarget();
              hint = document.createElement('span');
              hint.dataset.colabHighlight = '';
              hint.dataset.colabSelectionHint = '';

              hint.setAttribute('aria-live', 'polite');
              hint.textContent = 'Select some text to comment';
              hint.style.cssText = `position:absolute;pointer-events:none;z-index:2147483646;max-width:calc(100vw - 32px);padding:4px 8px;border:1px solid #888;background:#fff;color:#555;font:12px/1.4 sans-serif;left:${Math.max(8, Math.min(innerWidth - 220, event.clientX)) + scrollX}px;top:${event.clientY + scrollY + 12}px`;

          let selected = JSON.stringify({ selector: null, rect: null });

            keyboardSelecting = false,
            selectionFrame;

              rect = null;

                    b = range.comparePoint(span.node, span.end);

                    end = i + 1;

                renderId,

                rect,

              y: event.clientY,
              startedAt: performance.now(),
              moved: false,

            if (!pointerSelecting) return;

              selecting &&
              event.isTrusted &&
              !event.altKey &&
              !event.ctrlKey &&
              !event.metaKey &&
              !event.shiftKey &&
              (!gesture || gesture.moved || performance.now() - gesture.startedAt < 500) &&
              !editingTarget(event.target) &&
              !getSelection()?.isCollapsed &&
              quote

              completedSelection = true;
              parent.postMessage({ type: 'colab.render.annotate', renderId }, '*');
            }
          };
          const cancelSelection = () => {
            gesture = undefined;
            pointerSelecting = false;
            keyboardSelecting = false;

          };

            if (!keyboardSelecting) return;

          };

              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&

              v.renderId === renderId &&

                  typeof s === 'object' &&

                  Object.keys(s).length === 2 &&

              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 3 &&

              typeof v === 'object' &&

              v &&
              typeof v === 'object' &&

              v.type === 'colab.render.scroll-thread' &&
              v.renderId === renderId &&
              v.requestId === requestId &&

              !v ||
              typeof v !== 'object' ||
              Array.isArray(v) ||
              Object.keys(v).length !== 4 ||
              v.type !== 'colab.render.highlight' ||
              v.renderId !== renderId ||
              typeof v.requestId !== 'string' ||

                  typeof item === 'object' &&

              document.addEventListener('pointerup', finishSelection, true);
              document.addEventListener('pointercancel', cancelSelection, true);
              document.addEventListener('keyup', finishKeyboardSelection, true);

            `<!doctype html><html><head>${acknowledgement}</head><body>${value.source}</body></html>`,

        };
        window.addEventListener('message', bind);
      })();
    </script>
