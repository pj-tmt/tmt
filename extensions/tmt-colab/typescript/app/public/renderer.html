<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Colab page renderer</title>
  </head>
  <body>
    <script>
      // Cosmetic quote capture/resolution only. Author code may tamper with this
      // renderer; nothing here authenticates text or grants an app capability.
      (() => {
        function install(renderId, port, theme) {
          // Presentation only: author code can tamper with this projection.
          document.documentElement.dataset.theme = theme;
          const utf8 = new TextEncoder();
          const excluded = 'head,script,style,template,noscript,[hidden],[data-colab-highlight]';
          const validQuote = (v) =>
            v &&
            typeof v === 'object' &&
            !Array.isArray(v) &&
            Object.keys(v).length === 3 &&
            typeof v.exact === 'string' &&
            v.exact.length > 0 &&
            utf8.encode(v.exact).length <= 16 * 1024 &&
            [v.prefix, v.suffix].every(
              (s) => typeof s === 'string' && [...s].length <= 32 && utf8.encode(s).length <= 128,
            );

            requestId = '',
            stopped = false,
            timer;
          let slots = [],
            slotRequestId = '';

          const vanished = new Set();
          let heightTimer,
            height = 0,
            innerScroll = false;
          function measureHeight() {
            heightTimer = undefined;
            if (stopped || !document.body) return;
            const body = document.body,
              root = document.documentElement,
              rect = body.getBoundingClientRect(),
              margin = parseFloat(getComputedStyle(body).marginBottom) || 0;

            // so content can shrink; retain root overflow and body/absolute content.

              1,
              Math.ceil(
                Math.max(
                  rect.bottom + scrollY + margin,
                  rect.top + scrollY + body.scrollHeight + margin,
                  root.scrollHeight > innerHeight + 1 ? root.scrollHeight : 0,
                ),
              ),
            );

            height = next;
            parent.postMessage({ type: 'colab.render.height', renderId, height }, '*');
          }
          const scheduleHeight = () => {
            if (!stopped && heightTimer === undefined) heightTimer = setTimeout(measureHeight, 100);
          };

            scheduleHeight();
            schedule();
            capture();
          });

              !event.isTrusted ||
              event.defaultPrevented ||
              event.button !== 0 ||
              event.metaKey ||
              event.ctrlKey ||
              event.shiftKey ||
              event.altKey

            } catch {
              return;

          const anchorRanges = new Map();
          const sheet = document.createElement('style');

              count = 0,
              unit = 0,
              white = false;

                    spans.push({ node, start: offset, end });
                    units.push(unit++);

                  white = true;
                } else {
                  points.push(point);
                  spans.push({ node, start: offset, end });
                  units.push(unit);
                  unit += point.length;
                  white = false;
                }
                if (points.length > 256 * 1024) throw new Error('text budget');
                offset = end;
              }

            if (points.at(-1) === ' ') {
              points.pop();
              spans.pop();
              units.pop();

          }
          let selected = JSON.stringify({ selector: null, rect: null });
          let pointerSelecting = false,
            keyboardSelecting = false,
            selectionFrame;

                    suffix: map.points.slice(end, end + 32).join(''),

                      selection.anchorOffset === range.startOffset;

              {

                renderId,
                text: selector?.exact ?? '',

                rect,

            pointerSelecting = false;
            selectionChanged();

          const cancelSelection = () => {
            pointerSelecting = false;
            keyboardSelecting = false;

            selectionChanged();

            try {
              CSS.highlights?.delete('colab-comments');

            markers?.remove();

          function resolveSlots() {
            if (stopped || !slotRequestId) return;

              let spacer = spacers.get(slot.id);

                spacer.remove();
                spacers.delete(slot.id);
                vanished.add(slot.id);

                spacer?.remove();
                spacers.delete(slot.id);
                continue;
              }
              if (!spacer) {
                spacer = document.createElement('div');

                spacers.set(slot.id, spacer);

              const height = `${slot.height}px`;
              if (spacer.style.minHeight !== height) spacer.style.minHeight = height;
              spacer.style.display = 'block';
              const top = spacer.getBoundingClientRect().top + scrollY;
              if (Number.isFinite(top) && top >= 0 && top <= 1000000)
                positions.push({ id: slot.id, top });
            }
            port.postMessage({
              type: 'colab.render.slots',
              renderId,
              requestId: slotRequestId,
              slots: positions,
            });
          }
          function resolve() {
            resolveSlots();
            if (stopped || !requestId) return;
            clear();
            const resolved = [],
              ranges = [],
              positions = [];
            try {
              const map = collect(),
                deadline = performance.now() + 20;
              for (const item of batch) {
                if (performance.now() > deadline) throw new Error('match budget');
                let offset = 0,
                  matches = 0,
                  selected = -1,
                  candidates = 0;
                while ((offset = map.text.indexOf(item.selector.exact, offset)) >= 0) {
                  if (++candidates > 64 || performance.now() > deadline)
                    throw new Error('match budget');
                  if (
                    map.text.slice(0, offset).endsWith(item.selector.prefix) &&
                    map.text
                      .slice(offset + item.selector.exact.length)
                      .startsWith(item.selector.suffix)
                  ) {
                    matches++;
                    selected = offset;
                  }
                  offset++;

                if (performance.now() > deadline) throw new Error('match budget');
                if (matches !== 1) continue;
                const start = map.units.indexOf(selected),
                  end = start + [...item.selector.exact].length - 1;
                if (start < 0 || !map.spans[end]) continue;
                const a = map.spans[start],
                  b = map.spans[end],
                  range = document.createRange();
                range.setStart(a.node, a.start);
                range.setEnd(b.node, b.end);
                resolved.push(item.id);
                // Empty ID is the unsaved composer's quote: resolve without drawing a marker.
                if (item.id === '') continue;
                ranges.push(range);
                anchorRanges.set(item.id, range);
                const top = Math.max(0, range.getBoundingClientRect().top + scrollY);
                if (Number.isFinite(top) && top <= 1000000) positions.push({ id: item.id, top });
              }

              } else if (ranges.length) {
                layer = document.createElement('div');
                layer.dataset.colabHighlight = '';
                layer.style.cssText =
                  'position:absolute;top:0;left:0;pointer-events:none;z-index:2147483647';
                let rectangles = 0;
                for (const range of ranges)
                  for (const rect of range.getClientRects()) {
                    if (++rectangles > 2048) throw new Error('highlight budget');
                    const mark = document.createElement('div');
                    mark.style.cssText = `position:absolute;pointer-events:none;background:#ffd76466;left:${rect.left + scrollX}px;top:${rect.top + scrollY}px;width:${rect.width}px;height:${rect.height}px`;
                    layer.append(mark);
                  }
                document.body.append(layer);
              }
              if (positions.length) {
                markers = document.createElement('div');
                markers.dataset.colabHighlight = '';
                markers.dataset.colabMarkers = '';
                markers.style.cssText =
                  'position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:2147483647';
                document.body.append(markers);
                const origin = markers.getBoundingClientRect().top + scrollY;
                const lines = new Map();
                for (const position of positions) {
                  const line = Math.round(position.top / 8) * 8;
                  const group = lines.get(line) ?? [];
                  group.push(position.id);
                  lines.set(line, group);
                }
                for (const [top, ids] of lines) {
                  const marker = document.createElement('button');
                  marker.type = 'button';
                  marker.dataset.colabThread = ids[0];
                  marker.textContent = ids.length > 1 ? String(ids.length) : '▪';
                  marker.title =
                    batch.find((item) => item.id === ids[0])?.selector.exact.slice(0, 80) ??

                  marker.addEventListener('click', (event) => {
                    if (event.isTrusted)
                      port.postMessage({
                        type: 'colab.render.open-thread',
                        renderId,
                        requestId,
                        id: ids[0],

                  });

                }
              }

              positions.length = 0;
              resolved.length = 0;
              clear();
            }

              type: 'colab.render.anchors',
              renderId,
              requestId,
              resolved,
              positions,
            });
          }
          const schedule = () => {
            clearTimeout(timer);
            timer = setTimeout(resolve, 100);
          };
          port.onmessage = (event) => {
            const v = event.data;
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&
              v.type === 'colab.render.slots' &&
              v.renderId === renderId &&
              typeof v.requestId === 'string' &&
              /^[0-9a-f-]{36}$/.test(v.requestId) &&
              Array.isArray(v.slots) &&
              v.slots.length <= 200 &&
              new Set(v.slots.map((s) => s?.id)).size === v.slots.length &&
              v.slots.every(
                (s) =>
                  s &&
                  typeof s === 'object' &&
                  !Array.isArray(s) &&
                  Object.keys(s).length === 2 &&
                  typeof s.id === 'string' &&
                  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s.id) &&
                  Number.isInteger(s.height) &&
                  s.height >= 0 &&
                  s.height <= 2000,
              )

              for (const [id, spacer] of spacers)
                if (!v.slots.some((s) => s.id === id)) {
                  spacer.remove();
                  spacers.delete(id);
                  vanished.delete(id);
                }

              slotRequestId = v.requestId;
              resolveSlots();
              scheduleHeight();
              return;
            }
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 3 &&
              v.type === 'colab.render.theme' &&
              v.renderId === renderId &&
              (v.theme === 'light' || v.theme === 'dark')
            ) {
              document.documentElement.dataset.theme = v.theme;
              return;
            }
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 3 &&
              v.type === 'colab.render.layout' &&
              v.renderId === renderId &&
              v.mode === 'frame'

              innerScroll = true;
              resolveSlots();
              return;
            }
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&
              v.type === 'colab.render.scroll-thread' &&
              v.renderId === renderId &&
              v.requestId === requestId &&
              typeof v.id === 'string' &&
              anchorRanges.has(v.id)
            ) {
              if (innerScroll)
                anchorRanges.get(v.id).startContainer.parentElement?.scrollIntoView();
              return;
            }
            if (
              !v ||
              typeof v !== 'object' ||
              Array.isArray(v) ||
              Object.keys(v).length !== 4 ||
              v.type !== 'colab.render.highlight' ||
              v.renderId !== renderId ||
              typeof v.requestId !== 'string' ||
              !/^[0-9a-f-]{36}$/.test(v.requestId) ||
              !Array.isArray(v.anchors) ||
              v.anchors.length > 1000
            )
              return;
            if (utf8.encode(JSON.stringify(v)).length > 256 * 1024) return;
            if (
              !v.anchors.every(
                (item) =>
                  item &&
                  typeof item === 'object' &&
                  !Array.isArray(item) &&
                  Object.keys(item).length === 2 &&
                  Object.keys(item).every((key) => ['id', 'selector'].includes(key)) &&
                  typeof item.id === 'string' &&
                  item.id.length <= 73 &&

            requestId = v.requestId;

          };

            if (
              mutations.some(
                (m) =>
                  !layer?.contains(m.target) &&
                  !markers?.contains(m.target) &&

                    m.target instanceof Element && m.target.hasAttribute('data-colab-proposal-slot')

            !event.isComposing &&

            !event.shiftKey &&
            !event.ctrlKey &&

            'pagehide',

    </script>
  </body>
</html>
