                      s.chip.width >= 1 &&
                      s.chip.width <= 1000 &&
                      Number.isInteger(s.chip.height) &&
                      s.chip.height >= 1 &&
                      s.chip.height <= 200)) &&

                  s.height >= 0 &&
                  s.height <= 2000,

                  spacers.delete(id);

                  beforeSpacers.delete(id);
                  vanished.delete(id);

                  marker.remove();
                  chipSpacers.delete(id);

              slotRequestId = v.requestId;

              schedule();
              scheduleHeight();

            }
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 3 &&
              v.type === 'colab.render.theme' &&
              v.renderId === renderId &&
              (v.theme === 'light' || v.theme === 'dark')
            ) {
              document.documentElement.dataset.theme = v.theme;
              return;
            }
            if (
              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 3 &&
              v.type === 'colab.render.layout' &&
              v.renderId === renderId &&
              v.mode === 'frame'

              resolveSlots();
              return;
            }

              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&
              v.type === 'colab.render.reveal' &&
              v.renderId === renderId &&
              typeof v.requestId === 'string' &&
              /^[0-9a-f-]{36}$/.test(v.requestId) &&
              typeof v.id === 'string' &&

                type: 'colab.render.revealed',
                renderId,
                requestId: v.requestId,
                found: matches.length === 1,

              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&
              v.type === 'colab.render.scroll-reading' &&
              v.renderId === renderId &&
              v.requestId === questionRequestId &&
              typeof v.id === 'string' &&

            }

              v &&
              typeof v === 'object' &&
              !Array.isArray(v) &&
              Object.keys(v).length === 4 &&
              v.type === 'colab.render.scroll-thread' &&
              v.renderId === renderId &&
              v.requestId === requestId &&
              typeof v.id === 'string' &&
              anchorRanges.has(v.id)

              !v ||
              typeof v !== 'object' ||
              Array.isArray(v) ||
              Object.keys(v).length !== 6 ||
              v.type !== 'colab.render.highlight' ||
              v.renderId !== renderId ||
              typeof v.requestId !== 'string' ||

          };
          const observer = new MutationObserver((mutations) => {

            'load',
            () => {

                childList: true,
                characterData: true,
                attributes: true,

              document.addEventListener('pointerdown', startSelection, true);
              document.addEventListener('pointerup', finishSelection, true);
              document.addEventListener('pointercancel', cancelSelection, true);
              document.addEventListener('keyup', finishKeyboardSelection, true);
              document.addEventListener('click', chooseTarget, true);
              document.addEventListener('pointermove', hoverTarget, true);

            !event.metaKey;

              .composedPath()

              event.defaultPrevented ||

              !event.repeat &&
              event.key.toLowerCase() === 'k' &&
              !event.altKey &&
              !event.shiftKey &&
              event.ctrlKey !== event.metaKey

                {
                  type: 'colab.render.key',
                  renderId,
                  key: 'K',
                  ctrlKey: event.ctrlKey,
                  metaKey: event.metaKey,
                  altKey: false,
                  shiftKey: false,

                '*',

              (event.shiftKey &&
                [
                  'ArrowLeft',
                  'ArrowRight',
                  'ArrowUp',
                  'ArrowDown',
                  'Home',
                  'End',
                  'PageUp',
                  'PageDown',

            }

              !pointerSelecting &&
              !keyboardSelecting &&
              !getSelection()?.isCollapsed &&
              !editing &&
              event.altKey &&
              event.key === 'Enter'

          };
          document.addEventListener('keydown', annotate);
          addEventListener('resize', clearTarget);
          addEventListener('scroll', clearTarget, { passive: true });
          addEventListener('resize', capture);
          addEventListener('scroll', capture, { passive: true });

          addEventListener('resize', scheduleHeight);

            'pagehide',
            () => {

              clearTimeout(heightTimer);

              observer.disconnect();

              clear();
              clearTarget();
              document.removeEventListener('selectionchange', selectionChanged);
              document.removeEventListener('pointerdown', startSelection, true);
              document.removeEventListener('pointerup', finishSelection, true);
              document.removeEventListener('pointercancel', cancelSelection, true);
              document.removeEventListener('keyup', finishKeyboardSelection, true);
              document.removeEventListener('click', chooseTarget, true);
              document.removeEventListener('pointermove', hoverTarget, true);
              document.removeEventListener('click', anchor, true);
              document.removeEventListener('keydown', annotate);
              removeEventListener('resize', clearTarget);
              removeEventListener('scroll', clearTarget);
              removeEventListener('resize', capture);
              removeEventListener('scroll', capture);

              removeEventListener('resize', scheduleHeight);

            { once: true },

            !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:[0-9a-f]{64}$/.test(

            `<!doctype html><html><head>${acknowledgement}</head><body>${value.source}</body></html>`,

        };
        window.addEventListener('message', bind);
      })();
    </script>
