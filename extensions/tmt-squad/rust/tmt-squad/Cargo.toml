[package]
workspace = "../../../../rust"
name = "tmt-squad"
version = "0.1.0-alpha.13"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Released as its own product (tmt-squad-v<version>), installed with `tmt extension install squad`.
[package.metadata.dist]
dist = true
# A package list replaces the workspace list, so it repeats the shared files.
include = [
    "../../../../LICENSE",
    "../../../../rust/archive/NATIVE-INSTALL.md",
    "../../../../rust/target/native-notices/THIRD-PARTY-NOTICES.txt",
    "../../skills",
]

# Squad reaches core only through public commands and `tmt api`; the
# architecture guard permits only neutral invoke/style leaves.
[dependencies]
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true
ratatui.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
tmt-invoke.workspace = true
tmt-tui.workspace = true
tmt-cli-style = { workspace = true, features = ["ratatui"] }

[target.'cfg(unix)'.dependencies]
subprocess.workspace = true
nix.workspace = true
signal-hook.workspace = true

[lints]
workspace = true
