<!doctype html>
<html lang="en" data-tmt-page="error">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page unavailable</title>
    <link rel="stylesheet" href="/sdk/pages.css" />
  </head>
  <body>
    <header class="header">
      <span class="header-brand">
        <span class="header-mark">tmt</span><span class="header-wordmark">Remote</span>
      </span>
      <h1 class="header-title">Page unavailable</h1>
    </header>
    <main class="page error">
      <section class="sheet" aria-labelledby="heading">
        <div class="sheet-body">
          <span class="state-mark" aria-hidden="true">✗</span>
          <p class="eyebrow">Page unavailable</p>
          <h2 id="heading">This page is unavailable</h2>
          <p>Run <code>tmt remote pair</code> again for a new link.</p>
        </div>
      </section>
    </main>
  </body>
</html>
