<!doctype html>
<html lang="en" data-tmt-page="pair">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pair this browser</title>
    <link rel="stylesheet" href="/sdk/pages.css" />
    <script src="/sdk/pair.js"></script>
  </head>
  <body>
    <header class="header tmt-ui-header">
      <span class="header-brand tmt-ui-brand">
        <!-- Static-host mark from design/browser-ui/src/header.tsx (#2207). -->
        <svg
          class="header-mark tmt-ui-mark"
          viewBox="0 0 200 200"
          aria-hidden="true"
          fill="currentColor"
        >
          <g transform="rotate(0 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g>
          <g transform="rotate(60 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g>
          <g transform="rotate(120 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g>
          <g transform="rotate(180 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g>
          <g transform="rotate(240 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g>
          <g transform="rotate(300 100 100)">
            <path d="M100 18A82 82 0 0 1 164 49C143 45 117 55 110 77L92 75C85 50 87 31 100 18Z" />
          </g></svg
        ><span class="header-wordmark tmt-ui-wordmark">Remote</span>
      </span>
      <h1 class="header-title tmt-ui-title">Pair a browser</h1>
    </header>
    <main class="page">
      <section
        id="notice"
        class="sheet tmt-ui-notice"
        data-tone="waiting"
        aria-labelledby="heading"
      >
        <div class="sheet-body tmt-ui-notice-body">
          <div class="tmt-ui-notice-mark">
            <span id="mark" class="state-mark" aria-hidden="true">◆</span
            ><span id="state-label">Initializing</span>
          </div>
          <p class="eyebrow tmt-ui-notice-eyebrow">Browser pairing</p>
          <h2 id="heading" class="tmt-ui-notice-heading">Pair this browser with tmt remote</h2>
          <form id="pair">
            <div class="tmt-ui-field">
              <label id="name-label" class="tmt-ui-field-label" for="name">Device name</label>
              <input
                id="name"
                class="tmt-ui-field-control"
                aria-labelledby="name-label"
                maxlength="64"
                required
                value="Browser"
              />
            </div>
            <button class="tmt-ui-action" type="submit" aria-describedby="status" disabled>
              <span class="tmt-ui-action-label">Pair</span>
            </button>
          </form>
          <div id="comparison" hidden>
            <p class="words-label">Words</p>
            <p id="words"></p>
          </div>
          <p id="status" role="status">Pairing is unavailable until the current offer is ready.</p>
          <p id="entry-link" hidden><a href="/">Return to Remote and connect</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
