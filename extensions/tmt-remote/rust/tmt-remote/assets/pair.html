<!doctype html>
<html lang="en" data-tmt-page="pair">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pair this browser</title>
    <link rel="stylesheet" href="/sdk/pages.css" />
    <script src="/sdk/pair.js"></script>
  </head>
  <body>
    <header class="header">
      <span class="header-brand">
        <span class="header-mark">tmt</span><span class="header-wordmark">Remote</span>
      </span>
      <h1 class="header-title">Pair a browser</h1>
    </header>
    <main class="page">
      <section class="sheet" aria-labelledby="heading">
        <div class="sheet-body">
          <span id="mark" class="state-mark" aria-hidden="true">◆</span>
          <p class="eyebrow">Browser pairing</p>
          <h2 id="heading">Pair this browser with tmt remote</h2>
          <form id="pair">
            <label for="name">Device name</label>
            <input id="name" maxlength="64" required value="Browser" />
            <button type="submit">Pair</button>
          </form>
          <div id="comparison" hidden>
            <p class="words-label">Words</p>
            <p id="words"></p>
          </div>
          <p id="status" role="status"></p>
        </div>
      </section>
    </main>
  </body>
</html>
