[package]
workspace = "../../../../rust"
name = "tmt-remote"
version = "0.1.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# Packaged independently under tmt-remote-v<version>; publication has separate gates.
[package.metadata.dist]
dist = true
# A package list replaces the workspace list, so it repeats the shared files.
include = [
    "../../../../LICENSE",
    "../../../../rust/archive/NATIVE-INSTALL.md",
    "../../../../rust/target/native-notices/THIRD-PARTY-NOTICES.txt",
]

[dependencies]
ed25519-dalek.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
httparse.workspace = true
nix = { workspace = true, features = ["socket"] }
rusqlite.workspace = true
tmt-invoke.workspace = true
tmt-extension-state.workspace = true
signal-hook.workspace = true
tmt-cli-style.workspace = true

[lints]
workspace = true
